name: HPOS Alpha 4.4.2 Architecture Runtime CI

on:
  push:
    branches: [hpos-runtime-architecture-v1-20260828]
  pull_request:
    paths:
      - 'alpha41/alpha442.js'
      - 'scripts/apply_hpos_alpha442.py'
      - 'tests/test_alpha442_architecture_runtime.py'
      - 'config/hpos_constitution.json'
      - 'data/thesis_registry.json'
      - '.github/workflows/hpos-alpha442-ci.yml'
      - '.github/workflows/hpos-news.yml'

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Architecture runtime tests
        run: python -m unittest tests.test_alpha442_architecture_runtime -v
      - name: Apply patch chain twice
        run: |
          python scripts/apply_hpos_ux42.py
          python scripts/apply_hpos_alpha43.py
          python scripts/apply_hpos_alpha431.py
          python scripts/apply_hpos_alpha432.py
          python scripts/apply_hpos_alpha433.py
          python scripts/apply_hpos_alpha44.py
          python scripts/apply_hpos_alpha441.py
          python scripts/apply_hpos_alpha442.py
          python scripts/apply_hpos_alpha442.py
      - name: Syntax and source order
        run: |
          node --check alpha41/alpha442.js
          python - <<'PY'
          from pathlib import Path
          t=Path('alpha41/index.html').read_text()
          assert "1.3.0-alpha.4.4.2" in t
          assert t.count('alpha442.js')==1
          assert t.index('alpha44.js') < t.index('alpha441.js') < t.index('alpha442.js')
          assert 'ALPHA 4.4.2 · Architecture Runtime' in t
          print('Alpha 4.4.2 runtime chain OK')
          PY
