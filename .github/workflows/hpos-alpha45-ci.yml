name: HPOS Alpha 4.5 State Ledger CI

on:
  push:
    branches: [main, hpos-state-ledger-v1-20260828]
    paths:
      - 'config/current_state.schema.json'
      - 'config/transaction_ledger.schema.json'
      - 'alpha41/alpha45.js'
      - 'scripts/apply_hpos_alpha45.py'
      - 'scripts/apply_hpos_alpha442.py'
      - 'tests/test_alpha45_state_ledger.py'
      - '.github/workflows/hpos-alpha45-ci.yml'
  pull_request:
    paths:
      - 'config/current_state.schema.json'
      - 'config/transaction_ledger.schema.json'
      - 'alpha41/alpha45.js'
      - 'scripts/apply_hpos_alpha45.py'
      - 'scripts/apply_hpos_alpha442.py'
      - 'tests/test_alpha45_state_ledger.py'

jobs:
  state-ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schemas
        run: |
          python -m json.tool config/current_state.schema.json >/dev/null
          python -m json.tool config/transaction_ledger.schema.json >/dev/null
      - name: State ledger tests
        run: python -m unittest tests.test_alpha45_state_ledger -v
      - name: Apply patch chain twice
        run: |
          python scripts/apply_hpos_alpha45.py
          python scripts/apply_hpos_alpha45.py
      - name: Syntax and source order
        run: |
          node --check alpha41/alpha45.js
          python - <<'PY'
          from pathlib import Path
          t=Path('alpha41/index.html').read_text()
          assert t.count('alpha45.js') == 1
          assert t.index('alpha442.js') < t.index('alpha45.js')
          assert "1.3.0-alpha.4.5" in t
          assert not Path('data/portfolio/parqet_snapshot.json').exists()
          print('Alpha 4.5 state/ledger invariants: OK')
          PY
