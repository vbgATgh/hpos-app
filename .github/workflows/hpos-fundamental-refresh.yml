name: HPOS Fundamental Evidence Refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/fundamental_adapters.json'
      - 'config/fundamental_source_policy.json'
      - 'config/asset_sources.json'
      - 'config/fundamental_asset_sources.json'
      - 'data/thesis_registry.json'
      - 'scripts/fetch_sec_fundamentals.py'
      - 'scripts/fetch_ir_fundamentals.py'
      - 'scripts/build_fundamental_coverage.py'
      - 'tests/test_alpha461_ir_adapter.py'
      - 'tests/test_fundamental_source_coverage_complete.py'
      - '.github/workflows/hpos-fundamental-refresh.yml'
  schedule:
    - cron: '35 6 * * *'
      timezone: 'Europe/Berlin'
    - cron: '35 18 * * *'
      timezone: 'Europe/Berlin'
permissions:
  contents: write
concurrency:
  group: hpos-fundamental-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Contract tests
        run: python -m unittest tests.test_fundamental_evidence tests.test_alpha46_fundamentals tests.test_alpha461_ir_adapter tests.test_fundamental_source_coverage_complete -v
      - name: Build coverage
        run: python scripts/build_fundamental_coverage.py
      - name: SEC primary/regulator evidence
        id: sec
        continue-on-error: true
        run: python scripts/fetch_sec_fundamentals.py
      - name: Official company IR fallback
        id: ir
        continue-on-error: true
        run: python scripts/fetch_ir_fundamentals.py
      - name: Validate generated public evidence
        run: |
          test -f data/fundamental/evidence.json || echo '{"schemaVersion":1,"generatedAt":null,"items":[],"adapterStatus":[]}' > data/fundamental/evidence.json
          python -m json.tool data/fundamental/evidence.json >/dev/null
          python - <<'PY'
          import json
          x=json.load(open('data/fundamental/evidence.json'))
          forbidden={'shares','broker','avgEntryPrice','cashEur','purchasePrice','portfolioValue','portfolioValueEur','currentValue','currentPrice','taxProfile','openOrders','savingPlans'}
          found=[]
          def walk(v,path='$'):
              if isinstance(v,dict):
                  for k,val in v.items():
                      if k in forbidden: found.append(f'{path}.{k}')
                      walk(val,f'{path}.{k}')
              elif isinstance(v,list):
                  for i,val in enumerate(v): walk(val,f'{path}[{i}]')
          walk(x)
          assert not found, 'private portfolio field keys leaked into public evidence: '+', '.join(found[:10])
          assert all(i.get('sourceTier') in {'PRIMARY','REGULATOR','PROFESSIONAL','RESEARCH'} for i in x.get('items',[]))
          print(f"Public evidence privacy/source boundary: OK ({len(x.get('items',[]))} items)")
          PY
      - name: Commit evidence snapshots
        run: |
          git add data/fundamental
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'hpos-fundamental-bot'
          git config user.email 'hpos-fundamental-bot@users.noreply.github.com'
          git commit -m 'chore(data): fundamental evidence aktualisieren'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Adapter health summary
        run: |
          echo "SEC outcome: ${{ steps.sec.outcome }}"
          echo "IR outcome: ${{ steps.ir.outcome }}"
          if [ "${{ steps.sec.outcome }}" = "failure" ] && [ "${{ steps.ir.outcome }}" = "failure" ]; then
            echo 'Both direct fundamental adapters failed; do not treat evidence as current.'
          fi
