name: HPOS Alpha 4.3.2 CI

on:
  workflow_dispatch:
  push:
    branches: [alpha432-halal-news-hardening-20260827, hotfix-alpha432-version-refresh-20260827]
    paths:
      - '.github/workflows/hpos-alpha432-ci.yml'
      - '.github/workflows/hpos-news.yml'
      - 'alpha41/**'
      - 'scripts/apply_hpos_alpha431.py'
      - 'scripts/apply_hpos_alpha432.py'
      - 'scripts/fetch_hpos_news.py'
      - 'scripts/fetch_hpos_news_portfolio.py'
      - 'scripts/fetch_hpos_direct_news.py'
      - 'config/news_sources.json'
      - 'config/source_registry.json'
      - 'config/asset_sources.json'
      - 'data/portfolio/parqet_snapshot.json'
      - 'tests/test_alpha432_logic.mjs'
      - 'tests/test_alpha432_sources.py'
      - 'tests/test_news_fetch.py'
      - 'tests/test_news_portfolio_scope.py'

permissions:
  contents: write

concurrency:
  group: hpos-alpha432-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Daten- und Quellenlogik testen
        run: python -m unittest tests.test_news_fetch tests.test_news_portfolio_scope tests.test_alpha432_sources -v
      - name: Halal-Auflösung testen
        run: node tests/test_alpha432_logic.mjs
      - name: Alpha 4.3.2 integrieren und Idempotenz prüfen
        run: |
          python scripts/apply_hpos_ux42.py
          python scripts/apply_hpos_alpha43.py
          python scripts/apply_hpos_alpha431.py
          python scripts/apply_hpos_alpha432.py
          cp alpha41/index.html /tmp/index-first.html
          python scripts/apply_hpos_alpha431.py
          python scripts/apply_hpos_alpha432.py
          cmp -s alpha41/index.html /tmp/index-first.html
      - name: JavaScript und Invarianten
        shell: bash
        run: |
          node --check alpha41/news-414.js
          node --check alpha41/ux-42-core.js
          node --check alpha41/news-42.js
          node --check alpha41/ux-421.js
          node --check alpha41/alpha43.js
          node --check alpha41/alpha431.js
          node --check alpha41/alpha432.js
          python - <<'PY'
          from pathlib import Path
          import json
          t=Path('alpha41/index.html').read_text(encoding='utf-8')
          assert t.count('alpha432.js') == 1
          assert "const APP_VERSION='1.3.0-alpha.4.3.2';" in t
          assert "const APP_VERSION='1.3.0-alpha.4.3.1.2';" not in t
          assert 'ALPHA 4.3.2 · Halal & News Hardening' in t
          js=t.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/hpos-inline.js').write_text(js,encoding='utf-8')
          assert not any(line.lstrip().startswith('import ') for line in js.splitlines())
          snap=json.loads(Path('data/portfolio/parqet_snapshot.json').read_text(encoding='utf-8'))
          src=json.loads(Path('config/asset_sources.json').read_text(encoding='utf-8'))
          real={h['isin'].upper() for h in snap['holdings']}
          mapped={a['isin'].upper() for a in src['assets'] if a.get('url') and a.get('domain')}
          assert len(real)==19
          assert real <= mapped, sorted(real-mapped)
          print('Alpha 4.3.2 invariants: OK')
          PY
          node --check /tmp/hpos-inline.js
      - name: Discovery Scope Live-Test
        id: news
        continue-on-error: true
        run: python scripts/fetch_hpos_news_portfolio.py
      - name: Offizielle Direktquellen ergänzen
        id: direct
        continue-on-error: true
        run: python scripts/fetch_hpos_direct_news.py
      - name: News- und Quellenabdeckung auditieren
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          st=json.loads(Path('data/news/news_status.json').read_text(encoding='utf-8'))
          feed=json.loads(Path('data/news/news_feed.json').read_text(encoding='utf-8'))
          snap=json.loads(Path('data/portfolio/parqet_snapshot.json').read_text(encoding='utf-8'))
          real={h['isin'].upper() for h in snap['holdings']}
          index=feed.get('assetIndex',{})
          portfolio_keys={k for k,v in index.items() if str(v.get('isin') or '').upper() in real}
          counts=Counter(x.get('assetKey') for x in feed.get('items',[]) if x.get('assetKey') in portfolio_keys)
          rio_direct=[x for x in feed.get('items',[]) if x.get('assetKey')=='RIO_TINTO' and x.get('primarySource') and x.get('source')=='Rio Tinto']
          jnj_direct=[x for x in feed.get('items',[]) if x.get('assetKey')=='JNJ' and x.get('primarySource') and x.get('source')=='Johnson & Johnson']
          print('Portfolio assets with news:', len(counts), dict(counts))
          print('Direct Rio/JNJ:', len(rio_direct), len(jnj_direct))
          assert st.get('portfolioAssetsConfigured',0) >= 19
          assert st.get('portfolioPrimarySourcesMapped') == 19
          assert len(counts) >= 10, f'Nur {len(counts)} Depotwerte mit Meldungen im Snapshot'
          assert len(rio_direct) <= 5
          assert len(jnj_direct) <= 5
          PY
      - name: Browser Smoke News
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/hpos-server.log 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=9000 --dump-dom 'http://127.0.0.1:8000/alpha41/?ci=432#news' >/tmp/news432.html
          grep -q 'ALPHA 4.3.2' /tmp/news432.html
          grep -q 'Mein Depot' /tmp/news432.html
          grep -q 'Scalable' /tmp/news432.html
          grep -q 'Trade Republic' /tmp/news432.html
          grep -q 'Watchlist' /tmp/news432.html
          grep -q 'Quellen' /tmp/news432.html
          python - <<'PY'
          import re
          t=open('/tmp/news432.html',encoding='utf-8').read()
          ids=set(re.findall(r'data-na42="([^"]+)"',t))
          print('Visible mapped asset ids:',len(ids))
          assert len(ids)>=3, ids
          PY
      - name: Browser Smoke Halal
        shell: bash
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:8000/alpha41/?ci=432#halal' >/tmp/halal432.html
          grep -q 'ALPHA 4.3.2' /tmp/halal432.html
          grep -q 'Halal' /tmp/halal432.html
      - name: Generierte Integration und Snapshots sichern
        shell: bash
        run: |
          git add alpha41/index.html data/news || true
          if git diff --cached --quiet; then
            echo 'Keine generierte Änderung.'
            exit 0
          fi
          git config user.name 'hpos-alpha432-bot'
          git config user.email 'hpos-alpha432-bot@users.noreply.github.com'
          git commit -m 'chore(alpha432): geprüfte Integration und News-Snapshots sichern'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
