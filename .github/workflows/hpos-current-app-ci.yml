name: HPOS Current App CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/functions/hpos-api/**'
      - 'supabase/functions/hpos-profile/**'
      - 'data/halal_financial_evidence.json'
      - 'data/halal_market_value_36m.json'
      - 'scripts/build_halal_market_value_evidence.py'
      - 'tests/test_hpos_profile_sources.py'
      - 'tests/test_halal_canonical_backend.py'
      - 'tests/test_oauth_callback_diagnostics.py'
      - 'tests/test_oauth_callback_safari.py'
      - 'tests/test_parqet_reauth_guard.py'
      - 'tests/test_parqet_income_sync.py'
      - 'tests/test_decision_board.py'
      - '.github/workflows/hpos-current-app-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'supabase/functions/hpos-api/**'
      - 'supabase/functions/hpos-profile/**'
      - 'data/halal_financial_evidence.json'
      - 'data/halal_market_value_36m.json'
      - 'scripts/build_halal_market_value_evidence.py'
      - 'tests/test_hpos_profile_sources.py'
      - 'tests/test_halal_canonical_backend.py'
      - 'tests/test_oauth_callback_diagnostics.py'
      - 'tests/test_oauth_callback_safari.py'
      - 'tests/test_parqet_reauth_guard.py'
      - 'tests/test_parqet_income_sync.py'
      - 'tests/test_decision_board.py'
      - '.github/workflows/hpos-current-app-ci.yml'

permissions:
  contents: read

jobs:
  current-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check browser JavaScript syntax
        run: find app -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run current app regression tests
        run: >-
          python -m pytest -q
          tests/test_halal_canonical_backend.py
          tests/test_hpos_profile_sources.py
          tests/test_oauth_callback_diagnostics.py
          tests/test_oauth_callback_safari.py
          tests/test_parqet_reauth_guard.py
          tests/test_parqet_income_sync.py
          tests/test_decision_board.py
