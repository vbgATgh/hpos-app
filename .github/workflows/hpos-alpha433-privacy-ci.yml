name: HPOS Alpha 4.3.3 Privacy Boundary CI

on:
  push:
    branches:
      - alpha433-privacy-boundary-20260827
      - alpha433-local-projection-hotfix-20260827
  pull_request:
    paths:
      - '.gitignore'
      - 'alpha41/privacy-local43-shim.js'
      - 'alpha41/alpha43.js'
      - 'alpha41/alpha433.js'
      - 'scripts/apply_hpos_alpha433.py'
      - 'scripts/fetch_hpos_news_portfolio.py'
      - 'config/news_sources.json'
      - 'config/asset_sources.json'
      - 'tests/test_alpha432_sources.py'
      - 'tests/test_alpha433_privacy.py'
      - '.github/workflows/hpos-alpha433-privacy-ci.yml'
      - '.github/workflows/hpos-news.yml'

permissions:
  contents: read

jobs:
  privacy-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Privacy- und Quellenregressionen testen
        run: python -m unittest tests.test_alpha432_sources tests.test_alpha433_privacy -v
      - name: Privacy-Patcher zweimal anwenden
        run: |
          python scripts/apply_hpos_alpha433.py
          cp alpha41/index.html /tmp/privacy-once.html
          python scripts/apply_hpos_alpha433.py
          cmp /tmp/privacy-once.html alpha41/index.html
      - name: JavaScript und Privacy-Invarianten prüfen
        shell: bash
        run: |
          node --check alpha41/privacy-local43-shim.js
          node --check alpha41/alpha43.js
          node --check alpha41/alpha433.js
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path('alpha41/index.html').read_text(encoding='utf-8')
          m=re.search(r"const APP_VERSION='1\.3\.0-alpha\.(\d+)\.(\d+)(?:\.(\d+))?';",t)
          assert m
          version=tuple(int(x or 0) for x in m.groups())
          assert version >= (4,3,3), version
          assert t.count('alpha433.js') == 1
          assert t.count('privacy-local43-shim.js') == 1
          assert t.index('privacy-local43-shim.js') < t.index('alpha43.js')
          assert not Path('data/portfolio/parqet_snapshot.json').exists()
          legacy=Path('alpha41/alpha43.js').read_text(encoding='utf-8')
          assert "brokerRule:'Lokale Brokerzuordnung; nicht im öffentlichen Code gespeichert.'" in legacy
          assert 'Eine gegebenenfalls umfangreichere externe Aktivitätshistorie ist nicht vollständig als lokales Journal gespiegelt.' in legacy
          print('Privacy Boundary auf Version',version,'OK')
          PY
      - name: Browser Smoke Local Projection
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/hpos433-server.log 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8000/alpha41/?ci=privacy#dashboard' >/tmp/privacy-home.html
          grep -q 'Gesamtdepot' /tmp/privacy-home.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:8000/alpha41/?ci=privacy#data' >/tmp/privacy-data.html
          grep -q 'Privacy Boundary' /tmp/privacy-data.html
          grep -q 'Verschlüsseltes Backup' /tmp/privacy-data.html
          grep -q 'LOCAL ONLY' /tmp/privacy-data.html
      - name: Öffentliche Datenpipeline ohne Depot-Snapshot testen
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          root=Path('.')
          spec=importlib.util.spec_from_file_location('scope433',root/'scripts/fetch_hpos_news_portfolio.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          cfg=json.loads((root/'config/news_sources.json').read_text())
          reg=json.loads((root/'config/asset_sources.json').read_text())['assets']
          runtime,meta=mod.expand(cfg,reg)
          assert meta['registryAssets'] >= 19
          assert meta['primaryMapped'] == meta['registryAssets']
          assert all(a.get('scope') in ('UNIVERSE','TEST') for a in runtime['assets'])
          PY
      - name: Leak-Guard
        shell: bash
        run: |
          test ! -e data/portfolio/parqet_snapshot.json
          ! git grep -n -E '"shares"[[:space:]]*:|"purchaseValue"[[:space:]]*:|"purchasePrice"[[:space:]]*:|"holdingId"[[:space:]]*:' -- 'data/**' ':!data/market/**' ':!data/news/**'
          test ! -e .github/workflows/hpos-alpha43-ci.yml
          test ! -e .github/workflows/hpos-alpha431-ci.yml
          test ! -e .github/workflows/hpos-alpha432-ci.yml
