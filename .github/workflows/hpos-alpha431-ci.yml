name: HPOS Alpha 4.3.1 CI

on:
  workflow_dispatch:
  push:
    branches: [alpha431-usability-20260827]
    paths:
      - '.github/workflows/hpos-alpha431-ci.yml'
      - '.github/workflows/hpos-news.yml'
      - 'alpha41/**'
      - 'scripts/apply_hpos_alpha431.py'
      - 'scripts/fetch_hpos_news_portfolio.py'
      - 'scripts/fetch_hpos_market.py'
      - 'config/market_sources.json'
      - 'config/news_sources.json'
      - 'data/portfolio/parqet_snapshot.json'
      - 'tests/test_news_fetch.py'
      - 'tests/test_news_portfolio_scope.py'

permissions:
  contents: write

concurrency:
  group: hpos-alpha431-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: News und Portfolio-Scope Tests
        run: python -m unittest tests.test_news_fetch tests.test_news_portfolio_scope -v
      - name: Alpha 4.3.1 integrieren und Idempotenz prüfen
        run: |
          python scripts/apply_hpos_ux42.py
          python scripts/apply_hpos_alpha43.py
          python scripts/apply_hpos_alpha431.py
          cp alpha41/index.html /tmp/index-first.html
          python scripts/apply_hpos_alpha431.py
          cmp -s alpha41/index.html /tmp/index-first.html
      - name: JavaScript und Invarianten
        shell: bash
        run: |
          node --check alpha41/news-414.js
          node --check alpha41/ux-42-core.js
          node --check alpha41/news-42.js
          node --check alpha41/ux-421.js
          node --check alpha41/alpha43.js
          node --check alpha41/alpha431.js
          python - <<'PY'
          from pathlib import Path
          import json
          t=Path('alpha41/index.html').read_text(encoding='utf-8')
          assert t.count('alpha431.js') == 1
          assert '1.3.0-alpha.4.3.1' in t
          assert '1.3.0-alpha.4.3.1.1' not in t
          assert 'ALPHA 4.3.1 · Usability' in t
          js=t.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/hpos-inline.js').write_text(js,encoding='utf-8')
          assert not any(line.lstrip().startswith('import ') for line in js.splitlines())
          m=json.loads(Path('config/market_sources.json').read_text(encoding='utf-8'))
          s=json.loads(Path('data/portfolio/parqet_snapshot.json').read_text(encoding='utf-8'))
          real={h['isin'] for h in s['holdings']}
          cfg={a.get('isin') for a in m['assets'] if a.get('enabled')}
          missing=sorted(real-cfg)
          assert not missing, missing
          assert len(real)==19, len(real)
          print('Alpha 4.3.1 invariants: OK')
          PY
          node --check /tmp/hpos-inline.js
      - name: Discovery Scope Live-Test
        id: news
        continue-on-error: true
        run: python scripts/fetch_hpos_news_portfolio.py
      - name: Marktdaten Live-Test
        id: market
        continue-on-error: true
        run: python scripts/fetch_hpos_market.py
      - name: Marktdatenabdeckung auditieren
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/portfolio/parqet_snapshot.json').read_text())
          m=json.loads(Path('data/market/market_summary.json').read_text())
          by_isin={str(v.get('isin') or '').upper():k for k,v in m.get('assetIndex',{}).items()}
          rows=[]
          for h in s['holdings']:
              k=by_isin.get(h['isin'].upper())
              state=m.get('assets',{}).get(k,{}).get('state') if k else 'MISSING'
              rows.append((h['name'],h['isin'],k,state))
          ok=sum(r[3]=='CURRENT' for r in rows)
          print('\n'.join(map(str,rows)))
          print(f'Real holding market coverage: {ok}/{len(rows)}')
          # Merge darf erst erfolgen, wenn die große Mehrheit belastbar abgedeckt ist.
          assert ok >= 17, f'Nur {ok}/{len(rows)} aktuelle Marktzeitreihen'
          PY
      - name: News-Scope auditieren
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          st=json.loads(Path('data/news/news_status.json').read_text())
          print(json.dumps(st,ensure_ascii=False,indent=2)[:8000])
          assert st.get('portfolioAssetsConfigured',0) >= 19
          assert st.get('watchlistAssetsConfigured',0) >= 58
          assert st.get('watchlistAssetsFetchedThisRun',0) >= 15
          PY
      - name: Browser Smoke Home
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/hpos-server.log 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:8000/alpha41/?ci=431#dashboard' >/tmp/home.html
          grep -q 'ALPHA 4.3.1' /tmp/home.html
          grep -q 'Top Mover' /tmp/home.html
          grep -q 'context431' /tmp/home.html
          grep -q 'Antippen für Details' /tmp/home.html
          grep -q 'period-note431' /tmp/home.html
      - name: Browser Smoke Depot Income Analyse News
        shell: bash
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:8000/alpha41/?ci=431#portfolio' >/tmp/depot.html
          grep -q 'Top Mover' /tmp/depot.html
          grep -q 'context431' /tmp/depot.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:8000/alpha41/?ci=431#income' >/tmp/income.html
          grep -q 'Aktuelle Income-Rate' /tmp/income.html
          grep -q 'Gap' /tmp/income.html
          grep -q 'context431' /tmp/income.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:8000/alpha41/?ci=431#analysis' >/tmp/analysis.html
          grep -q 'analysis-card43 click431' /tmp/analysis.html
          grep -q 'context431' /tmp/analysis.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://127.0.0.1:8000/alpha41/?ci=431#news' >/tmp/news.html
          grep -q 'Mein Depot' /tmp/news.html
          grep -q 'Trade Republic' /tmp/news.html
          grep -q 'Watchlist' /tmp/news.html
          grep -q 'context431' /tmp/news.html
      - name: Generierte Integration sichern
        shell: bash
        run: |
          git add alpha41/index.html data/news data/market || true
          if git diff --cached --quiet; then
            echo 'Keine generierte Änderung.'
            exit 0
          fi
          git config user.name 'hpos-alpha431-bot'
          git config user.email 'hpos-alpha431-bot@users.noreply.github.com'
          git commit -m 'chore(alpha431): geprüfte Integration und Snapshots sichern'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
