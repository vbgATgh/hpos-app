name: HPOS Alpha 4.5.1 Tax Halal CI
on:
  pull_request:
    paths:
      - 'alpha41/alpha451.js'
      - 'scripts/apply_hpos_alpha451.py'
      - 'tests/test_alpha451_tax_halal.py'
      - 'config/tax_profile.schema.json'
      - 'config/halal_sources.json'
      - '.github/workflows/hpos-alpha451-ci.yml'
jobs:
  tax-halal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Validate JSON
        run: |
          python -m json.tool config/tax_profile.schema.json >/dev/null
          python -m json.tool config/halal_sources.json >/dev/null
      - name: Tax and halal tests
        run: python -m unittest tests.test_alpha451_tax_halal -v
      - name: Apply patcher twice
        run: |
          python scripts/apply_hpos_alpha451.py
          python scripts/apply_hpos_alpha451.py
      - name: Syntax and order
        run: |
          node --check alpha41/alpha451.js
          python - <<'PY'
          from pathlib import Path
          t=Path('alpha41/index.html').read_text()
          assert '1.3.0-alpha.4.5.1' in t
          assert t.count('alpha451.js')==1
          assert t.index('alpha45.js') < t.index('alpha451.js')
          print('Alpha 4.5.1 tax + halal contract OK')
          PY
