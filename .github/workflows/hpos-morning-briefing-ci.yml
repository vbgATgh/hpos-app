name: HPOS Morning Briefing Candidate CI

on:
  push:
    paths:
      - 'config/morning_briefing_candidate.schema.json'
      - 'scripts/validate_morning_briefing_candidate.py'
      - 'tests/test_morning_briefing_ingestion.py'
      - 'data/thesis_registry.json'
      - '.github/workflows/hpos-morning-briefing-ci.yml'
  pull_request:
    paths:
      - 'config/morning_briefing_candidate.schema.json'
      - 'scripts/validate_morning_briefing_candidate.py'
      - 'tests/test_morning_briefing_ingestion.py'
      - 'data/thesis_registry.json'
      - '.github/workflows/hpos-morning-briefing-ci.yml'

permissions:
  contents: read

jobs:
  briefing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile scripts/validate_morning_briefing_candidate.py
      - name: Run briefing ingestion tests
        run: python -m pytest -q tests/test_morning_briefing_ingestion.py
