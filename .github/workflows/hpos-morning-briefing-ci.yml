name: HPOS Morning Briefing Candidate CI

on:
  push:
    paths:
      - 'config/morning_briefing_candidate.schema.json'
      - 'scripts/validate_morning_briefing_candidate.py'
      - 'scripts/match_morning_briefing_evidence.py'
      - 'scripts/review_morning_briefing_evidence.py'
      - 'scripts/validate_morning_briefing_promotion.py'
      - 'scripts/validate_promotion_sequence.py'
      - 'scripts/project_verification_state.py'
      - 'tests/test_morning_briefing_ingestion.py'
      - 'tests/test_morning_briefing_evidence_matcher.py'
      - 'tests/test_morning_briefing_evidence_review.py'
      - 'tests/test_morning_briefing_promotion.py'
      - 'tests/test_morning_briefing_case_2026_09_02.py'
      - 'tests/test_promotion_sequence.py'
      - 'tests/test_verification_projection.py'
      - 'data/thesis_registry.json'
      - 'data/asset_catalog.json'
      - 'data/asset_identity_aliases.json'
      - 'data/fundamental/evidence.json'
      - 'data/fundamental/evidence_curated.json'
      - 'data/briefing_cases/**'
      - 'data/promotion_decisions/**'
      - 'data/verification_projection.json'
      - 'app/verification-status.js'
      - '.github/workflows/hpos-morning-briefing-ci.yml'
  pull_request:
    paths:
      - 'config/morning_briefing_candidate.schema.json'
      - 'scripts/validate_morning_briefing_candidate.py'
      - 'scripts/match_morning_briefing_evidence.py'
      - 'scripts/review_morning_briefing_evidence.py'
      - 'scripts/validate_morning_briefing_promotion.py'
      - 'scripts/validate_promotion_sequence.py'
      - 'scripts/project_verification_state.py'
      - 'tests/test_morning_briefing_ingestion.py'
      - 'tests/test_morning_briefing_evidence_matcher.py'
      - 'tests/test_morning_briefing_evidence_review.py'
      - 'tests/test_morning_briefing_promotion.py'
      - 'tests/test_morning_briefing_case_2026_09_02.py'
      - 'tests/test_promotion_sequence.py'
      - 'tests/test_verification_projection.py'
      - 'data/thesis_registry.json'
      - 'data/asset_catalog.json'
      - 'data/asset_identity_aliases.json'
      - 'data/fundamental/evidence.json'
      - 'data/fundamental/evidence_curated.json'
      - 'data/briefing_cases/**'
      - 'data/promotion_decisions/**'
      - 'data/verification_projection.json'
      - 'app/verification-status.js'
      - '.github/workflows/hpos-morning-briefing-ci.yml'

permissions:
  contents: read

jobs:
  briefing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile briefing tools
        run: |
          python -m py_compile scripts/validate_morning_briefing_candidate.py
          python -m py_compile scripts/match_morning_briefing_evidence.py
          python -m py_compile scripts/review_morning_briefing_evidence.py
          python -m py_compile scripts/validate_morning_briefing_promotion.py
          python -m py_compile scripts/validate_promotion_sequence.py
          python -m py_compile scripts/project_verification_state.py
          node --check app/verification-status.js
      - name: Run briefing pipeline tests
        run: python -m pytest -q tests/test_morning_briefing_ingestion.py tests/test_morning_briefing_evidence_matcher.py tests/test_morning_briefing_evidence_review.py tests/test_morning_briefing_promotion.py tests/test_morning_briefing_case_2026_09_02.py tests/test_promotion_sequence.py tests/test_verification_projection.py
      - name: Validate promotion decision ordering
        run: python scripts/validate_promotion_sequence.py data/promotion_decisions
      - name: Project committed verification state
        run: python scripts/project_verification_state.py data/promotion_decisions
      - name: Check committed UI verification projection
        run: python scripts/project_verification_state.py --check data/verification_projection.json
