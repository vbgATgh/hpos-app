name: HPOS Morning Briefing Candidate CI

on:
  push:
    paths:
      - 'config/morning_briefing_candidate.schema.json'
      - 'scripts/validate_morning_briefing_candidate.py'
      - 'scripts/match_morning_briefing_evidence.py'
      - 'scripts/review_morning_briefing_evidence.py'
      - 'tests/test_morning_briefing_ingestion.py'
      - 'tests/test_morning_briefing_evidence_matcher.py'
      - 'tests/test_morning_briefing_evidence_review.py'
      - 'data/thesis_registry.json'
      - 'data/fundamental/evidence.json'
      - '.github/workflows/hpos-morning-briefing-ci.yml'
  pull_request:
    paths:
      - 'config/morning_briefing_candidate.schema.json'
      - 'scripts/validate_morning_briefing_candidate.py'
      - 'scripts/match_morning_briefing_evidence.py'
      - 'scripts/review_morning_briefing_evidence.py'
      - 'tests/test_morning_briefing_ingestion.py'
      - 'tests/test_morning_briefing_evidence_matcher.py'
      - 'tests/test_morning_briefing_evidence_review.py'
      - 'data/thesis_registry.json'
      - 'data/fundamental/evidence.json'
      - '.github/workflows/hpos-morning-briefing-ci.yml'

permissions:
  contents: read

jobs:
  briefing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile briefing tools
        run: |
          python -m py_compile scripts/validate_morning_briefing_candidate.py
          python -m py_compile scripts/match_morning_briefing_evidence.py
          python -m py_compile scripts/review_morning_briefing_evidence.py
      - name: Run briefing pipeline tests
        run: python -m pytest -q tests/test_morning_briefing_ingestion.py tests/test_morning_briefing_evidence_matcher.py tests/test_morning_briefing_evidence_review.py
