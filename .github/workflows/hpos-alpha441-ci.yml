name: HPOS Alpha 4.4.1 UX Thesis CI
on:
  push:
    branches: [alpha441-ux-thesis-intelligence-20260827]
    paths:
      - 'alpha41/alpha441.js'
      - 'scripts/apply_hpos_alpha44.py'
      - 'scripts/apply_hpos_alpha441.py'
      - 'tests/test_alpha44_decision.py'
      - 'tests/test_alpha441_thesis.py'
      - 'docs/alpha441-thesis-methodology.md'
      - '.github/workflows/hpos-news.yml'
      - '.github/workflows/hpos-alpha441-ci.yml'
  pull_request:
    paths:
      - 'alpha41/alpha441.js'
      - 'scripts/apply_hpos_alpha44.py'
      - 'scripts/apply_hpos_alpha441.py'
      - 'tests/test_alpha44_decision.py'
      - 'tests/test_alpha441_thesis.py'
      - 'docs/alpha441-thesis-methodology.md'
      - '.github/workflows/hpos-news.yml'
      - '.github/workflows/hpos-alpha441-ci.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decision- und Thesis-Verträge testen
        run: python -m unittest tests.test_alpha44_decision tests.test_alpha441_thesis -v
      - name: Patcher-Reihenfolge und Idempotenz prüfen
        run: |
          python scripts/apply_hpos_alpha44.py
          python scripts/apply_hpos_alpha441.py
          cp alpha41/index.html /tmp/alpha441-once.html
          python scripts/apply_hpos_alpha44.py
          python scripts/apply_hpos_alpha441.py
          cmp -s alpha41/index.html /tmp/alpha441-once.html
      - name: JavaScript und Integrationsinvarianten
        run: |
          node --check alpha41/alpha44.js
          node --check alpha41/alpha441.js
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('alpha41/index.html').read_text(encoding='utf-8')
          m=re.search(r"1\.3\.0-alpha\.(\d+)\.(\d+)(?:\.(\d+))?",t)
          assert m
          version=tuple(int(x or 0) for x in m.groups())
          assert version >= (4,4,1), version
          assert t.count('alpha441.js') == 1
          assert t.index('alpha44.js') < t.index('alpha441.js')
          js=Path('alpha41/alpha441.js').read_text(encoding='utf-8')
          for x in ['Investmentthese','Konfidenz','Invalidierung','Portfolio-Fit','Was hat sich verändert?']:
              assert x in js, x
          prod=Path('.github/workflows/hpos-news.yml').read_text(encoding='utf-8')
          assert 'apply_hpos_alpha441.py' in prod
          assert 'test_alpha441_thesis' in prod
          print('Alpha 4.4.1 layer remains present in newer release')
          PY
      - name: Browser Smoke
        run: |
          python -m http.server 8000 >/tmp/hpos441.log 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8000/alpha41/?ci=441#portfolio' >/tmp/p441.html
          grep -q 'alpha441.js' /tmp/p441.html
          grep -q 'Portfolio' /tmp/p441.html
      - name: Integration committen
        if: github.event_name == 'push'
        run: |
          git add alpha41/index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'hpos-alpha441-bot'
          git config user.email 'hpos-alpha441-bot@users.noreply.github.com'
          git commit -m 'chore(alpha441): UX Thesis Intelligence integrieren'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
