name: HPOS Data Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hpos-news.yml'
      - 'scripts/fetch_hpos_news.py'
      - 'scripts/fetch_hpos_news_portfolio.py'
      - 'scripts/fetch_hpos_direct_news.py'
      - 'scripts/fetch_hpos_market.py'
      - 'scripts/apply_hpos_ux42.py'
      - 'scripts/apply_hpos_alpha43.py'
      - 'scripts/apply_hpos_alpha431.py'
      - 'scripts/apply_hpos_alpha432.py'
      - 'scripts/apply_hpos_alpha433.py'
      - 'scripts/apply_hpos_alpha44.py'
      - 'config/news_sources.json'
      - 'config/market_sources.json'
      - 'config/source_registry.json'
      - 'config/asset_sources.json'
      - 'tests/test_news_fetch.py'
      - 'tests/test_alpha432_sources.py'
      - 'tests/test_alpha432_version_patch.py'
      - 'tests/test_alpha433_privacy.py'
      - 'tests/test_alpha44_decision.py'
      - 'alpha41/news-414.js'
      - 'alpha41/news-42.js'
      - 'alpha41/ux-42-core.js'
      - 'alpha41/ux-421.js'
      - 'alpha41/privacy-local43-shim.js'
      - 'alpha41/alpha43.js'
      - 'alpha41/alpha431.js'
      - 'alpha41/alpha432.js'
      - 'alpha41/alpha433.js'
      - 'alpha41/alpha44.js'
  schedule:
    - cron: '15 6 * * *'
      timezone: 'Europe/Berlin'
    - cron: '15 18 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write

concurrency:
  group: hpos-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Parser, Version, Quellen, Privacy und Decision Engine testen
        run: |
          python -m unittest tests.test_news_fetch tests.test_alpha432_sources tests.test_alpha432_version_patch tests.test_alpha433_privacy tests.test_alpha44_decision -v

      - name: UI-Integration sicherstellen
        run: |
          python scripts/apply_hpos_ux42.py
          python scripts/apply_hpos_alpha43.py
          python scripts/apply_hpos_alpha431.py
          python scripts/apply_hpos_alpha432.py
          python scripts/apply_hpos_alpha433.py
          python scripts/apply_hpos_alpha44.py

      - name: JavaScript und Startinvarianten prüfen
        shell: bash
        run: |
          node --check alpha41/news-414.js
          node --check alpha41/ux-42-core.js
          node --check alpha41/news-42.js
          node --check alpha41/ux-421.js
          node --check alpha41/privacy-local43-shim.js
          node --check alpha41/alpha43.js
          node --check alpha41/alpha431.js
          node --check alpha41/alpha432.js
          node --check alpha41/alpha433.js
          node --check alpha41/alpha44.js
          python - <<'PY'
          from pathlib import Path
          t=Path('alpha41/index.html').read_text(encoding='utf-8')
          js=t.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/hpos-inline.js').write_text(js,encoding='utf-8')
          assert "const APP_VERSION='1.3.0-alpha.4.4';" in t
          assert 'ALPHA 4.4 · Decision Engine' in t
          for name in ['news-414.js','ux-42-core.js','news-42.js','ux-421.js','privacy-local43-shim.js','alpha43.js','alpha431.js','alpha432.js','alpha433.js','alpha44.js']:
              assert name in t, name
          assert t.count('alpha44.js') == 1
          assert t.count('privacy-local43-shim.js') == 1
          assert t.index('privacy-local43-shim.js') < t.index('alpha43.js') < t.index('alpha44.js')
          assert not Path('data/portfolio/parqet_snapshot.json').exists()
          legacy=Path('alpha41/alpha43.js').read_text(encoding='utf-8')
          assert "brokerRule:'Lokale Brokerzuordnung; nicht im öffentlichen Code gespeichert.'" in legacy
          assert 'Eine gegebenenfalls umfangreichere externe Aktivitätshistorie ist nicht vollständig als lokales Journal gespiegelt.' in legacy
          assert not any(line.lstrip().startswith('import ') for line in js.splitlines())
          market=Path('config/market_sources.json').read_text(encoding='utf-8')
          assert '"assetKey":"SPACEX"' in market and '"enabled":false' in market
          print('Alpha 4.4 production + privacy invariants: OK')
          PY
          node --check /tmp/hpos-inline.js

      - name: Discovery-News aus öffentlichem Asset-Universum abrufen
        id: discovery
        continue-on-error: true
        run: python scripts/fetch_hpos_news_portfolio.py

      - name: Offizielle Direktquellen ergänzen
        id: direct
        continue-on-error: true
        run: python scripts/fetch_hpos_direct_news.py

      - name: Kurs- und EUR-Snapshots aktualisieren
        id: market
        continue-on-error: true
        run: python scripts/fetch_hpos_market.py

      - name: Snapshots committen
        shell: bash
        run: |
          git add alpha41/index.html data/news data/market || true
          if git diff --cached --quiet; then
            echo 'Keine Änderungen.'
            exit 0
          fi
          git config user.name 'hpos-data-bot'
          git config user.email 'hpos-data-bot@users.noreply.github.com'
          git commit -m 'chore(data): News, Marktdaten und EUR-Referenzen aktualisieren'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Discovery-Ausfall als Fehler markieren
        if: steps.discovery.outcome == 'failure'
        run: |
          echo 'Der Discovery-Abruf ist vollständig fehlgeschlagen; vorhandene Snapshots wurden erhalten.'
          exit 1
