name: HPOS Data Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hpos-news.yml'
      - 'scripts/fetch_hpos_news.py'
      - 'scripts/fetch_hpos_news_portfolio.py'
      - 'scripts/fetch_hpos_direct_news.py'
      - 'scripts/fetch_hpos_market.py'
      - 'scripts/apply_hpos_ux42.py'
      - 'scripts/apply_hpos_alpha43.py'
      - 'scripts/apply_hpos_alpha431.py'
      - 'scripts/apply_hpos_alpha432.py'
      - 'scripts/apply_hpos_alpha433.py'
      - 'scripts/apply_hpos_alpha44.py'
      - 'scripts/apply_hpos_alpha441.py'
      - 'scripts/apply_hpos_alpha442.py'
      - 'scripts/apply_hpos_alpha45.py'
      - 'scripts/apply_hpos_alpha464.py'
      - 'scripts/apply_hpos_alpha47.py'
      - 'config/news_sources.json'
      - 'config/market_sources.json'
      - 'config/source_registry.json'
      - 'config/asset_sources.json'
      - 'config/hpos_constitution.json'
      - 'config/asset_interchangeability.json'
      - 'config/capital_competition_policy.json'
      - 'config/current_state.schema.json'
      - 'config/transaction_ledger.schema.json'
      - 'data/thesis_registry.json'
      - 'data/asset_catalog.json'
      - 'data/fundamental/thesis_signals.json'
      - 'tests/test_news_fetch.py'
      - 'tests/test_alpha432_sources.py'
      - 'tests/test_alpha432_version_patch.py'
      - 'tests/test_alpha433_privacy.py'
      - 'tests/test_alpha44_decision.py'
      - 'tests/test_alpha441_thesis.py'
      - 'tests/test_alpha442_architecture_runtime.py'
      - 'tests/test_alpha45_state_ledger.py'
      - 'tests/test_alpha464_interchangeability.py'
      - 'tests/test_alpha47_capital_allocation.py'
      - 'tests/test_alpha47_logic.mjs'
      - 'alpha41/news-414.js'
      - 'alpha41/news-42.js'
      - 'alpha41/ux-42-core.js'
      - 'alpha41/ux-421.js'
      - 'alpha41/privacy-local43-shim.js'
      - 'alpha41/alpha43.js'
      - 'alpha41/alpha431.js'
      - 'alpha41/alpha432.js'
      - 'alpha41/alpha433.js'
      - 'alpha41/alpha44.js'
      - 'alpha41/alpha441.js'
      - 'alpha41/alpha442.js'
      - 'alpha41/alpha45.js'
      - 'alpha41/alpha464.js'
      - 'alpha41/alpha47.js'
  schedule:
    - cron: '15 6 * * *'
      timezone: 'Europe/Berlin'
    - cron: '15 18 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write
concurrency:
  group: hpos-data-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Python einrichten
        uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Parser, Privacy, Architektur und Allocation testen
        run: |
          python -m unittest tests.test_news_fetch tests.test_alpha432_sources tests.test_alpha432_version_patch tests.test_alpha433_privacy tests.test_alpha44_decision tests.test_alpha441_thesis tests.test_alpha442_architecture_runtime tests.test_alpha45_state_ledger tests.test_alpha464_interchangeability tests.test_alpha47_capital_allocation -v
          node tests/test_alpha47_logic.mjs
      - name: UI-Integration sicherstellen
        run: |
          python scripts/apply_hpos_ux42.py
          python scripts/apply_hpos_alpha43.py
          python scripts/apply_hpos_alpha431.py
          python scripts/apply_hpos_alpha432.py
          python scripts/apply_hpos_alpha433.py
          python scripts/apply_hpos_alpha44.py
          python scripts/apply_hpos_alpha441.py
          python scripts/apply_hpos_alpha442.py
          python scripts/apply_hpos_alpha45.py
          python scripts/apply_hpos_alpha464.py
          python scripts/apply_hpos_alpha47.py
      - name: JavaScript und Startinvarianten prüfen
        shell: bash
        run: |
          for f in news-414.js ux-42-core.js news-42.js ux-421.js privacy-local43-shim.js alpha43.js alpha431.js alpha432.js alpha433.js alpha44.js alpha441.js alpha442.js alpha45.js alpha464.js alpha47.js; do node --check "alpha41/$f"; done
          python - <<'PY'
          from pathlib import Path
          import json,re
          t=Path('alpha41/index.html').read_text(encoding='utf-8')
          js=t.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/hpos-inline.js').write_text(js,encoding='utf-8')
          m=re.search(r"const APP_VERSION='1\.3\.0-alpha\.(\d+)\.(\d+)(?:\.(\d+))?';",t)
          assert m and tuple(int(x or 0) for x in m.groups()) >= (4,7,0)
          assert 'ALPHA 4.7 · Capital Allocation' in t
          names=['news-414.js','ux-42-core.js','news-42.js','ux-421.js','privacy-local43-shim.js','alpha43.js','alpha431.js','alpha432.js','alpha433.js','alpha44.js','alpha441.js','alpha442.js','alpha45.js','alpha464.js','alpha47.js']
          for name in names: assert name in t,name
          for name in ['privacy-local43-shim.js','alpha43.js','alpha44.js','alpha441.js','alpha442.js','alpha45.js','alpha464.js','alpha47.js']: assert t.count(name)==1,name
          assert t.index('privacy-local43-shim.js') < t.index('alpha43.js') < t.index('alpha44.js') < t.index('alpha441.js') < t.index('alpha442.js') < t.index('alpha45.js') < t.index('alpha464.js') < t.index('alpha47.js')
          assert not Path('data/portfolio/parqet_snapshot.json').exists()
          constitution=json.loads(Path('config/hpos_constitution.json').read_text())
          allocation=json.loads(Path('config/capital_competition_policy.json').read_text())
          assert constitution['portfolioRules']['cash']['absoluteHardFloorEur']==150
          assert constitution['portfolioRules']['healthcare']['hardCapPct']==30
          assert 'ASSETS_ARE_REPLACEABLE_CAPITAL_CANDIDATES' in constitution['principles']
          assert allocation['principle']=='THE_NEXT_EURO_HAS_NO_LOYALTY'
          assert allocation['hardBlocks']['halalAllowed']==['H1']
          assert not any(line.lstrip().startswith('import ') for line in js.splitlines())
          market=Path('config/market_sources.json').read_text(encoding='utf-8')
          assert '"assetKey":"SPACEX"' in market and '"enabled":false' in market
          print('Alpha 4.7 data-refresh + architecture + privacy invariants: OK')
          PY
          node --check /tmp/hpos-inline.js
      - name: Discovery-News aus öffentlichem Asset-Universum abrufen
        id: discovery
        continue-on-error: true
        run: python scripts/fetch_hpos_news_portfolio.py
      - name: Offizielle Direktquellen ergänzen
        id: direct
        continue-on-error: true
        run: python scripts/fetch_hpos_direct_news.py
      - name: Kurs- und EUR-Snapshots aktualisieren
        id: market
        continue-on-error: true
        run: python scripts/fetch_hpos_market.py
      - name: Snapshots committen
        shell: bash
        run: |
          git add alpha41/index.html data/news data/market || true
          if git diff --cached --quiet; then echo 'Keine Änderungen.'; exit 0; fi
          git config user.name 'hpos-data-bot'
          git config user.email 'hpos-data-bot@users.noreply.github.com'
          git commit -m 'chore(data): News, Marktdaten und EUR-Referenzen aktualisieren'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Discovery-Ausfall als Fehler markieren
        if: steps.discovery.outcome == 'failure'
        run: |
          echo 'Der Discovery-Abruf ist vollständig fehlgeschlagen; vorhandene Snapshots wurden erhalten.'
          exit 1
