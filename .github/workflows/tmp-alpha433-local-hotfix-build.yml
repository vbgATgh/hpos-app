name: TEMP Alpha 4.3.3 Local Projection Build

on:
  workflow_dispatch:
  push:
    branches: [alpha433-local-projection-hotfix-20260827]

permissions:
  contents: write

concurrency:
  group: alpha433-local-hotfix-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Legacy-Quelltext bereinigen
        run: python scripts/sanitize_alpha43_privacy.py
      - name: Privacy-Patcher anwenden
        run: python scripts/apply_hpos_alpha433.py
      - name: Syntax prüfen
        run: |
          node --check alpha41/privacy-local43-shim.js
          node --check alpha41/alpha43.js
          node --check alpha41/alpha433.js
      - name: Generierte Privacy-Änderungen committen
        run: |
          git add alpha41/alpha43.js alpha41/index.html
          if git diff --cached --quiet; then
            echo 'Keine generierten Änderungen.'
            exit 0
          fi
          git config user.name 'hpos-privacy-bot'
          git config user.email 'hpos-privacy-bot@users.noreply.github.com'
          git commit -m 'chore(privacy): Legacy 4.3 lokal projizieren und bereinigen'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
