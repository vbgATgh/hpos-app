name: HPOS Alpha 4.7 Capital Allocation CI
on:
  push:
    branches: [alpha47-capital-allocation-engine-20260828]
  pull_request:
    paths:
      - 'config/capital_competition_policy.json'
      - 'config/asset_interchangeability.json'
      - 'config/hpos_constitution.json'
      - 'data/asset_catalog.json'
      - 'data/fundamental/thesis_signals.json'
      - 'alpha41/alpha47.js'
      - 'scripts/apply_hpos_alpha47.py'
      - 'tests/test_alpha47_capital_allocation.py'
      - 'tests/test_alpha47_logic.mjs'
      - '.github/workflows/hpos-alpha47-ci.yml'
      - 'alpha41/index.html'
permissions:
  contents: write
jobs:
  allocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Validate policy
        run: python -m json.tool config/capital_competition_policy.json >/dev/null
      - name: Architecture tests
        run: python -m unittest tests.test_alpha47_capital_allocation -v
      - name: Pareto logic
        run: node tests/test_alpha47_logic.mjs
      - name: Apply patcher twice
        run: |
          python scripts/apply_hpos_alpha47.py
          cp alpha41/index.html /tmp/a47.html
          python scripts/apply_hpos_alpha47.py
          cmp -s alpha41/index.html /tmp/a47.html
      - name: Syntax, source order and privacy
        run: |
          node --check alpha41/alpha47.js
          python -m py_compile scripts/apply_hpos_alpha47.py
          python - <<'PY'
          from pathlib import Path
          t=Path('alpha41/index.html').read_text()
          assert "const APP_VERSION='1.3.0-alpha.4.7';" in t
          assert 'ALPHA 4.7 · Capital Allocation' in t
          assert t.count('alpha47.js')==1
          assert t.index('alpha464.js') < t.index('alpha47.js')
          s=Path('alpha41/alpha47.js').read_text()
          forbidden=['parqet_snapshot.json','taxProfile','portfolioId:','brokerAccountId']
          assert not any(x in s for x in forbidden)
          print('Alpha 4.7 allocation/privacy invariants: OK')
          PY
      - name: Integrated app commit
        if: github.event_name == 'push'
        run: |
          git add alpha41/index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'hpos-alpha47-bot'
          git config user.email 'hpos-alpha47-bot@users.noreply.github.com'
          git commit -m 'chore(alpha47): integrate capital allocation runtime'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
