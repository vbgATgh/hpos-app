name: HPOS Architecture CI

on:
  push:
    branches: [main, hpos-architecture-v1-20260828]
    paths:
      - 'config/hpos_constitution.json'
      - 'config/current_state.schema.json'
      - 'data/thesis_registry.json'
      - 'docs/HPOS_ARCHITECTURE_V1.md'
      - 'docs/agents/**'
      - 'tests/test_hpos_architecture.py'
      - '.github/workflows/hpos-architecture.yml'
  pull_request:
    paths:
      - 'config/hpos_constitution.json'
      - 'config/current_state.schema.json'
      - 'data/thesis_registry.json'
      - 'docs/HPOS_ARCHITECTURE_V1.md'
      - 'docs/agents/**'
      - 'tests/test_hpos_architecture.py'

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate JSON
        run: python -m json.tool config/hpos_constitution.json >/dev/null && python -m json.tool config/current_state.schema.json >/dev/null && python -m json.tool data/thesis_registry.json >/dev/null
      - name: Run architecture tests
        run: python -m pytest -q tests/test_hpos_architecture.py
