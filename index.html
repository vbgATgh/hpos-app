<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HPOS" />
  <meta name="description" content="HPOS – Halal Portfolio Optimization System" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>HPOS</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Navigation öffnen" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">
        <div class="brand-mark">H</div>
        <div><strong>HPOS</strong><small>Halal Portfolio Optimization System</small></div>
      </div>
      <button id="quickAddBtn" class="quick-add" aria-label="Transaktion erfassen">+</button>
    </header>

    <aside id="sidebar" class="sidebar" aria-hidden="true">
      <div class="side-head"><div class="brand-mark">H</div><div><strong>HPOS</strong><small id="snapshotLabel">Snapshot</small></div></div>
      <nav id="nav"></nav>
      <div class="side-foot">Lokale PWA · keine Orderausführung</div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <main id="content" class="content" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <dialog id="txDialog" class="sheet-dialog"></dialog>
  <dialog id="newsDialog" class="sheet-dialog"></dialog>
  <dialog id="watchDialog" class="sheet-dialog"></dialog>
  <dialog id="halalDialog" class="sheet-dialog"></dialog>

  <script src="app.js"></script>
</body>
</html>
