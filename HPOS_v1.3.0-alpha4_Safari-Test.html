        <div class="brand-mark">H</div>
        <div><strong>HPOS</strong><small>Local Analyst</small></div>

      </div>

        <div id="storageBadge" class="status-line">Lokal · Schema v3</div>

      </div>

    <header class="topbar">

<script>

/* === core/utils.mjs === */
const nowIso = () => new Date().toISOString();
const uuid = () => globalThis.crypto?.randomUUID?.() ?? `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
const round = (value, digits = 2) => {
  if (value === null || value === undefined || Number.isNaN(Number(value))) return null;
  const f = 10 ** digits;
  return Math.round((Number(value) + Number.EPSILON) * f) / f;
};
const isFiniteNumber = v => typeof v === 'number' && Number.isFinite(v);
const deepClone = value => structuredClone(value);
const byDateAsc = (a,b) => String(a.date ?? a.createdAt ?? '').localeCompare(String(b.date ?? b.createdAt ?? ''));
const normalizeSource = s => String(s ?? '').trim();
const normalizeTicker = s => String(s ?? '').trim().toUpperCase();
const statusRank = { UNKNOWN: 0, H1: 1, H2: 2, H0: 3 };
function daysBetween(a,b){
  const da = new Date(a); const db = new Date(b);
  if (Number.isNaN(da.getTime()) || Number.isNaN(db.getTime())) return null;
  return Math.floor((db-da)/86400000);
}
function stableStringify(obj){
  const seen = new WeakSet();
  const sort = v => {
    if (v && typeof v === 'object') {
      if (seen.has(v)) throw new TypeError('Circular structure');
      seen.add(v);
      if (Array.isArray(v)) return v.map(sort);
      return Object.keys(v).sort().reduce((o,k)=>{o[k]=sort(v[k]); return o;},{});
    }
    return v;
  };
  return JSON.stringify(sort(obj));
}


/* === core/standard-profile.mjs === */

  profileId: 'HPOS_STANDARD_2026_06',
  label: 'HPOS Standard',
  readOnly: true,
  rules: Object.freeze({

    healthcareCapPct: { ruleId:'SECTOR.HEALTHCARE.CAP', type:'MAX_CAP', value:30, unit:'PCT', configurable:true, source:'HPOS Masterfile', sourceDate:null, sourceNote:'Konsolidierter Masterfile-Stand; kein eindeutiges Regeldatum zugewiesen.' },
    cashMinPct: { ruleId:'LIQUIDITY.CASH.MIN', type:'MINIMUM', value:2, unit:'PCT', configurable:true, source:'HPOS Masterfile', sourceDate:null, sourceNote:'Konsolidierter Masterfile-Stand; kein eindeutiges Regeldatum zugewiesen.' },
    minPositionEur: { ruleId:'POSITION.MIN.REVIEW', type:'REVIEW_TRIGGER', value:300, unit:'EUR', configurable:true, source:'HPOS Masterfile / Masterbefehl', sourceDate:null, sourceNote:'Konsolidierter Masterfile-Stand; kein eindeutiges Regeldatum zugewiesen.' },
    watchlistMax: { ruleId:'WATCHLIST.MAX', type:'LIMIT', value:15, unit:'COUNT', configurable:true, source:'HPOS Masterfile / Architektur', sourceDate:'2026-06-12' },
    dividendGoalNetMonthlyEur: { ruleId:'GOAL.DIVIDEND.NET.MONTHLY', type:'GOAL', value:100, unit:'EUR_MONTH', configurable:true, source:'HPOS Masterfile / Projektziel', sourceDate:'2026-06-24' },
    dividendGoalDate: { ruleId:'GOAL.DIVIDEND.DATE', type:'GOAL', value:'2029-10', unit:'YYYY-MM', configurable:true, source:'HPOS Masterfile', sourceDate:'2026-06-24' },
    halalH0Action: { ruleId:'HALAL.H0.VETO', type:'HARD_VETO', value:'VETO_EXIT_REVIEW', configurable:true, source:'HPOS Masterfile / Masterbefehl', sourceDate:null, sourceNote:'Konsolidierter Masterfile-Stand; kein eindeutiges Regeldatum zugewiesen.' },
    halalH2Action: { ruleId:'HALAL.H2.FREEZE', type:'WORKFLOW', value:'FREEZE_REVIEW', configurable:true, source:'HPOS Masterfile', sourceDate:null, sourceNote:'Konsolidierter Masterfile-Stand; kein eindeutiges Regeldatum zugewiesen.' },
    halalSourcePriority: { ruleId:'HALAL.SOURCE.PRIORITY', type:'SOURCE_POLICY', value:['Musaffa','Zoya'], configurable:true, source:'HPOS Masterbefehl v3.0 (ältere generische Regel)', sourceDate:'2026-05-08' },
    nvoException: { ruleId:'ASSET.NVO.H2', type:'ASSET_EXCEPTION', value:'H2', configurable:false, source:'HPOS Masterfile (Einzeltitel-Ausnahme)', sourceDate:'2026-06-27', match:{isin:'DK0062498333', ticker:'NVO'} }
  }),
  productDefaults: Object.freeze({
    cashMode: { value:'OFF', source:'Produktentscheidung v1.3.1', note:'Verhindert fiktiv negatives Cash bei unvollständigen Verrechnungskontodaten.' },
    halalConflictPolicy: { value:'CONFLICT_TO_H2', source:'Produktentscheidung v1.3.1', note:'Konservativer Default; keine globale historische HPOS-Regel.' }
  })
});

const RULE_BY_ID = Object.freeze(Object.fromEntries(
  Object.values(STANDARD_PROFILE.rules).map(rule => [rule.ruleId, rule])
));


/* === core/model.mjs === */
function sameValue(a,b){ return JSON.stringify(a)===JSON.stringify(b); }

function createEmptyState(at = nowIso()){
  return {
    appMeta: { schemaVersion:3, appVersion:'1.3.0-alpha.4', createdAt:at, updatedAt:at, migrationHistory:[], lastSuccessfulLoadAt:null },
    standardProfile: deepClone(STANDARD_PROFILE),
    userProfile: { overrides:{}, cashMode:STANDARD_PROFILE.productDefaults.cashMode.value, halalSourcePriority:null, halalConflictPolicy:STANDARD_PROFILE.productDefaults.halalConflictPolicy.value, customRules:[], ui:{} },
    assets: [], transactions: [], halalChecks: [], watchlistEntries: [], reviews: [], alertState: [], newsEntries: [],
    dataStatus: {
      portfolio:{state:'UNKNOWN',source:'local',asOf:null,lastAttemptAt:null,message:'Noch keine Portfoliodaten erfasst.'},
      prices:{state:'UNKNOWN',source:null,asOf:null,lastAttemptAt:null,message:'Kurse nicht aktualisiert.'},
      halal:{state:'UNKNOWN',source:null,asOf:null,lastAttemptAt:null,message:'Halal-Status nicht vollständig geprüft.'},
      news:{state:'UNKNOWN',source:null,asOf:null,lastAttemptAt:null,message:'News nicht aktualisiert.'}
    },
    diagnostics: []
  };
}

function getEffectiveProfile(state){
  const rules = {};
  for (const [key, rule] of Object.entries(state.standardProfile.rules)) {
    const overridePresent = Object.prototype.hasOwnProperty.call(state.userProfile.overrides ?? {}, key);
    const overrideValue = overridePresent ? state.userProfile.overrides[key] : undefined;
    const actuallyOverridden = overridePresent && !sameValue(overrideValue, rule.value);
    rules[key] = { ...rule, standardValue:rule.value, effectiveValue: actuallyOverridden ? overrideValue : rule.value, overridden:actuallyOverridden };
  }
  if (Array.isArray(state.userProfile.halalSourcePriority) && state.userProfile.halalSourcePriority.length) {
    const std = rules.halalSourcePriority.standardValue;
    const custom = [...state.userProfile.halalSourcePriority];
    rules.halalSourcePriority = { ...rules.halalSourcePriority, effectiveValue:sameValue(custom,std)?std:custom, overridden:!sameValue(custom,std) };
  }
  return {
    rules,
    cashMode: state.userProfile.cashMode ?? state.standardProfile.productDefaults.cashMode.value,
    halalConflictPolicy: state.userProfile.halalConflictPolicy ?? state.standardProfile.productDefaults.halalConflictPolicy.value,
    customRules: Array.isArray(state.userProfile.customRules) ? state.userProfile.customRules.filter(r=>r.active!==false) : []
  };
}

function setOverride(state,key,value){
  const rule = state.standardProfile.rules[key];
  if (!rule) throw new Error(`Unbekannter Strategieparameter: ${key}`);
  if (!rule.configurable) throw new Error(`Parameter ist nicht konfigurierbar: ${key}`);
  if (sameValue(value, rule.value)) delete state.userProfile.overrides[key];
  else state.userProfile.overrides[key] = value;
  state.appMeta.updatedAt = nowIso();
  return state;
}

function resetOverride(state,key){
  delete state.userProfile.overrides[key];
  if (key === 'halalSourcePriority') state.userProfile.halalSourcePriority = null;
  state.appMeta.updatedAt = nowIso();
  return state;
}

function resetAllOverrides(state){
  state.userProfile.overrides = {};
  state.userProfile.halalSourcePriority = null;
  state.userProfile.halalConflictPolicy = state.standardProfile.productDefaults.halalConflictPolicy.value;
  state.appMeta.updatedAt = nowIso();
  return state;
}


/* === core/validation.mjs === */
const ROOT_ARRAYS = ['assets','transactions','halalChecks','watchlistEntries','reviews','alertState','newsEntries','diagnostics'];
function validateV3State(state){
  const errors=[];
  if (!state || typeof state !== 'object') return {ok:false,errors:['State ist kein Objekt.']};
  if (state.appMeta?.schemaVersion !== 3) errors.push('schemaVersion muss 3 sein.');
  for (const key of ROOT_ARRAYS) if (!Array.isArray(state[key])) errors.push(`${key} muss ein Array sein.`);
  if (!state.standardProfile?.readOnly) errors.push('standardProfile.readOnly muss true sein.');
  if (!state.userProfile || typeof state.userProfile !== 'object') errors.push('userProfile fehlt.');
  if (state.userProfile?.customRules !== undefined && !Array.isArray(state.userProfile.customRules)) errors.push('userProfile.customRules muss ein Array sein.');
  const ids = new Set();
  for (const a of state.assets ?? []) {
    if (!a.assetId) errors.push('Asset ohne assetId.');
    else if (ids.has(a.assetId)) errors.push(`Doppelte assetId: ${a.assetId}`);
    else ids.add(a.assetId);
    if (!a.name) errors.push(`Asset ${a.assetId ?? '?'} ohne name.`);
    if (!a.assetClass) errors.push(`Asset ${a.assetId ?? '?'} ohne assetClass.`);
  }
  return {ok:errors.length===0,errors};
}


/* === core/asset-service.mjs === */
function findAsset(state,{assetId,isin,ticker,exchange,name}={}){
  if (assetId) return state.assets.find(a=>a.assetId===assetId) ?? null;
  if (isin) {
    const m=state.assets.filter(a=>a.isin && a.isin.toUpperCase()===String(isin).toUpperCase());
    if (m.length===1) return m[0];
  }
  if (ticker) {
    const nt=normalizeTicker(ticker), ex=String(exchange??'').toUpperCase();
    const m=state.assets.filter(a=>normalizeTicker(a.ticker)===nt && (!ex || String(a.exchange??'').toUpperCase()===ex));
    if (m.length===1) return m[0];
  }
  if (name) {
    const nn=String(name).trim().toLowerCase();
    const m=state.assets.filter(a=>String(a.name).trim().toLowerCase()===nn);
    if (m.length===1) return m[0];
  }
  return null;
}

function upsertAsset(state,input){
  let asset=findAsset(state,input);
  if (!asset) {
    asset={assetId:input.assetId??uuid(),name:input.name||input.ticker||input.isin||'Unbenannt',assetClass:input.assetClass||'UNKNOWN',createdAt:nowIso(),updatedAt:nowIso()};
    state.assets.push(asset);
  }
  for (const k of ['name','assetClass','isin','wkn','ticker','exchange','currency','sector']) if (input[k]!==undefined && input[k]!==null && input[k]!=='') asset[k]=input[k];
  if (input.priceQuote) asset.priceQuote={...input.priceQuote};
  asset.updatedAt=nowIso();
  return asset;
}


/* === core/snapshot-engine.mjs === */
function freshPosition(asset){return {assetId:asset.assetId,name:asset.name,ticker:asset.ticker??null,isin:asset.isin??null,assetClass:asset.assetClass,sector:asset.sector??null,currency:asset.currency??'EUR',qty:0,avgCost:null,costValue:0,lastReferencePrice:null,lastReferenceAt:null};}

function buildSnapshot(state, {asOf=new Date().toISOString()}={}){
  const effective=getEffectiveProfile(state);
  const positions=new Map(state.assets.map(a=>[a.assetId,freshPosition(a)]));
  let cash = effective.cashMode==='TRACKED' ? 0 : null;
  const diagnostics=[];
  const txs=[...state.transactions].sort(byDateAsc);
  for (const tx of txs) {
    if (tx.type==='CASH_IN' && effective.cashMode==='TRACKED') { cash += Number(tx.amount||0); continue; }
    if (tx.type==='CASH_OUT' && effective.cashMode==='TRACKED') { cash -= Number(tx.amount||0); continue; }
    if (tx.type==='DIVIDEND' && effective.cashMode==='TRACKED') { cash += Number(tx.amount||0); continue; }
    if (!['BUY','SELL','OPENING_POSITION'].includes(tx.type)) continue;
    const p=positions.get(tx.assetId);
    if (!p) { diagnostics.push({code:'TX_ASSET_MISSING',severity:'ERROR',transactionId:tx.transactionId,message:'Transaktion verweist auf unbekanntes Asset.'}); continue; }
    const qty=Number(tx.qty||0), price=Number(tx.price||0);
    if (tx.type==='BUY' || tx.type==='OPENING_POSITION') {
      const oldCost=(p.avgCost??0)*p.qty;
      const addCost=qty*price;
      p.qty += qty;
      p.avgCost = p.qty>0 ? (oldCost+addCost)/p.qty : null;
      p.costValue = p.qty*(p.avgCost??0);
      if (Number.isFinite(price) && price>=0){p.lastReferencePrice=price;p.lastReferenceAt=tx.date;}
      if (tx.type==='BUY' && effective.cashMode==='TRACKED') cash -= addCost;
    } else if (tx.type==='SELL') {
      if (qty>p.qty) diagnostics.push({code:'OVERSELL_IN_JOURNAL',severity:'ERROR',transactionId:tx.transactionId,message:`Verkauf ${qty} > Bestand ${p.qty}.`});
      p.qty=Math.max(0,p.qty-qty); p.costValue=p.qty*(p.avgCost??0);
      if (Number.isFinite(price) && price>=0){p.lastReferencePrice=price;p.lastReferenceAt=tx.date;}
      if (effective.cashMode==='TRACKED') cash += qty*price;
    }
  }
  const active=[];
  for (const p of positions.values()) {
    if (p.qty<=0) continue;
    const asset=state.assets.find(a=>a.assetId===p.assetId);
    const q=asset?.priceQuote;
    const hasQuote=q && Number.isFinite(Number(q.price));
    const valuationPrice=hasQuote?Number(q.price):(Number.isFinite(Number(p.lastReferencePrice))?Number(p.lastReferencePrice):null);
    const valuationSource=hasQuote?'PRICE_QUOTE':(valuationPrice!==null?'TRANSACTION_REFERENCE':'UNKNOWN');
    const marketValue=valuationPrice===null?null:p.qty*valuationPrice;
    const performancePct=(hasQuote && p.avgCost!==null && p.avgCost!==0)?((Number(q.price)-p.avgCost)/p.avgCost*100):null;
    active.push({...p,valuationPrice,valuationSource,marketValue,performancePct,priceAsOf:hasQuote?(q.asOf??null):(p.lastReferenceAt??null)});
  }
  const allValued=active.every(p=>p.marketValue!==null);
  const holdingsValue=allValued?active.reduce((s,p)=>s+p.marketValue,0):null;
  const netWorth=(holdingsValue!==null && cash!==null)?holdingsValue+cash:null;
  const allocationBase=holdingsValue!==null ? holdingsValue + (cash!==null?Math.max(cash,0):0) : null;
  const sukukValue=allValued?active.filter(p=>/sukuk/i.test(p.assetClass||'')).reduce((s,p)=>s+p.marketValue,0):null;
  const healthcareValue=allValued?active.filter(p=>/health/i.test(p.sector||'')).reduce((s,p)=>s+p.marketValue,0):null;
  const sukukPct=allocationBase && sukukValue!==null ? sukukValue/allocationBase*100 : null;
  const healthcarePct=allocationBase && healthcareValue!==null ? healthcareValue/allocationBase*100 : null;
  const cashPct=(effective.cashMode==='TRACKED' && allocationBase && cash!==null)?cash/allocationBase*100:null;
  return {
    asOf, effectiveProfile:effective, positions:active, cash,
    totals:{holdingsValue:round(holdingsValue),netWorth:round(netWorth),allocationBase:round(allocationBase)},
    allocations:{sukukValue:round(sukukValue),sukukPct:round(sukukPct),healthcareValue:round(healthcareValue),healthcarePct:round(healthcarePct),cashPct:round(cashPct)},
    completeness:{allPositionsValued:allValued,hasCurrentQuotes:active.length>0 && active.every(p=>p.valuationSource==='PRICE_QUOTE')},
    diagnostics
  };
}


/* === core/transaction-service.mjs === */
function validateTransaction(state, tx){
  const errors=[],warnings=[];
  if (!tx.type) errors.push('Typ fehlt.');
  if (!tx.date) errors.push('Datum fehlt.');
  if (['BUY','SELL','OPENING_POSITION'].includes(tx.type)) {
    if (!tx.assetId) errors.push('Asset fehlt.');
    if (!(Number(tx.qty)>0)) errors.push('Stückzahl muss >0 sein.');
    if (!(Number(tx.price)>=0)) errors.push('Preis muss >=0 sein.');
  }
  if (['DIVIDEND','CASH_IN','CASH_OUT'].includes(tx.type) && !(Number(tx.amount)>0)) errors.push('Betrag muss >0 sein.');
  const snap=buildSnapshot(state);
  const pos=snap.positions.find(p=>p.assetId===tx.assetId);
  if (tx.type==='SELL' && Number(tx.qty)>(pos?.qty??0) && !tx.allowOversell) errors.push('Verkauf über vorhandene Stückzahl ist nicht erlaubt.');
  if (tx.type==='BUY' && snap.effectiveProfile.cashMode==='TRACKED') {
    const cost=Number(tx.qty)*Number(tx.price);
    if ((snap.cash??0)<cost && !tx.allowNegativeCash) errors.push('Cash reicht für diesen Kauf nicht. Einzahlung erfassen oder negativen Cash ausdrücklich bestätigen.');
    else if ((snap.cash??0)<cost) warnings.push('Negativer Cash wurde ausdrücklich zugelassen.');
  }
  return {ok:errors.length===0,errors,warnings};
}

function addTransaction(state,input){
  const tx={transactionId:input.transactionId??uuid(),createdAt:input.createdAt??nowIso(),enteredBy:input.enteredBy??'user',...input};
  const check=validateTransaction(state,tx);
  if (!check.ok) return {ok:false,errors:check.errors,warnings:check.warnings,state};
  state.transactions.push(tx); state.appMeta.updatedAt=nowIso();
  return {ok:true,transaction:tx,warnings:check.warnings,state};
}

function removeTransaction(state,transactionId){
  const n=state.transactions.length;
  state.transactions=state.transactions.filter(t=>t.transactionId!==transactionId);
  if (state.transactions.length===n) return {ok:false,error:'Transaktion nicht gefunden.'};
  state.appMeta.updatedAt=nowIso(); return {ok:true,state};
}


/* === core/halal-engine.mjs === */
const sourceEq=(a,b)=>String(a??'').trim().toLowerCase()===String(b??'').trim().toLowerCase();
function getEffectiveHalal(state,asset){
  const exception=state.standardProfile.rules.nvoException;
  const nvoMatch=(exception.match.isin && asset.isin===exception.match.isin) || (exception.match.ticker && String(asset.ticker??'').toUpperCase()===exception.match.ticker);
  const checks=state.halalChecks.filter(c=>c.assetId===asset.assetId).sort((a,b)=>String(b.checkedAt).localeCompare(String(a.checkedAt)));
  if (nvoMatch) return {status:'H2',conflict:true,reason:'Explizite NVO-Einzelregel im neueren Masterfile.',ruleId:exception.ruleId,checks};
  if (!checks.length) return {status:'UNKNOWN',conflict:false,reason:'Keine Halal-Prüfung hinterlegt.',ruleId:null,checks:[]};
  const latestBySource=[];
  for (const c of checks) if (!latestBySource.some(x=>sourceEq(x.source,c.source))) latestBySource.push(c);
  const statuses=[...new Set(latestBySource.map(c=>c.status))];
  if (statuses.length===1) return {status:statuses[0],conflict:false,reason:'Aktuelle Quellen stimmen überein oder es liegt nur eine Quelle vor.',ruleId:statuses[0]==='H0'?'HALAL.H0.VETO':statuses[0]==='H2'?'HALAL.H2.FREEZE':null,checks:latestBySource};
  const effective=getEffectiveProfile(state), policy=effective.halalConflictPolicy, priority=effective.rules.halalSourcePriority.effectiveValue;
  if (policy==='STRICTEST') {
    const strict=[...latestBySource].sort((a,b)=>statusRank[b.status]-statusRank[a.status])[0];
    return {status:strict.status,conflict:true,reason:'Quellenkonflikt; strengstes Urteil gemäß Nutzerpolitik.',ruleId:'HALAL.SOURCE.POLICY',checks:latestBySource};
  }
  if (policy==='PRIORITY_SOURCE') {
    for (const src of priority) {
      const c=latestBySource.find(x=>sourceEq(x.source,src));
      if (c) return {status:c.status,conflict:true,reason:`Quellenkonflikt; ${src} entscheidet gemäß Nutzerpriorität.`,ruleId:'HALAL.SOURCE.POLICY',checks:latestBySource};
    }
    return {status:'UNKNOWN',conflict:true,reason:'Quellenkonflikt; keine priorisierte Quelle vorhanden.',ruleId:'HALAL.SOURCE.POLICY',checks:latestBySource};
  }
  return {status:'H2',conflict:true,reason:'Quellenkonflikt → H2/manuelle Prüfung gemäß Produktdefault/Nutzerpolitik.',ruleId:'HALAL.SOURCE.POLICY',checks:latestBySource};
}


/* === core/rule-engine.mjs === */
function outcome(ruleId,status,actual,target,message,action,extra={}){return {ruleId,status,actual,target,message,action,...extra};}
function evaluateRules(state,snapshot){
  const r=snapshot.effectiveProfile.rules, out=[];
  const suk=snapshot.allocations.sukukPct;
  if (suk===null) out.push(outcome(r.sukukTargetPct.ruleId,'UNKNOWN',null,r.sukukTargetPct.effectiveValue,'Sukuk-Ziel derzeit nicht prüfbar, weil Bewertungsdaten fehlen.','Fehlende Bewertungsdaten ergänzen.',{source:r.sukukTargetPct.source}));
  else if (suk<r.sukukTargetPct.effectiveValue) out.push(outcome(r.sukukTargetPct.ruleId,'WARN',round(suk),r.sukukTargetPct.effectiveValue,`Sukuk liegt ${round(r.sukukTargetPct.effectiveValue-suk,1)} Prozentpunkte unter Ziel.`, 'Nächste Kapitalallokation bevorzugt auf Sukuk prüfen.',{source:r.sukukTargetPct.source}));
  else out.push(outcome(r.sukukTargetPct.ruleId,'OK',round(suk),r.sukukTargetPct.effectiveValue,'Sukuk-Ziel erreicht oder überschritten.','Keine regelbedingte Aktion.',{source:r.sukukTargetPct.source}));

  const hc=snapshot.allocations.healthcarePct;
  if (hc===null) out.push(outcome(r.healthcareCapPct.ruleId,'UNKNOWN',null,r.healthcareCapPct.effectiveValue,'Healthcare-Cap derzeit nicht prüfbar.','Bewertungsdaten ergänzen.',{source:r.healthcareCapPct.source}));
  else if (hc>r.healthcareCapPct.effectiveValue) out.push(outcome(r.healthcareCapPct.ruleId,'WARN',round(hc),r.healthcareCapPct.effectiveValue,`Healthcare liegt ${round(hc-r.healthcareCapPct.effectiveValue,1)} Prozentpunkte über Cap.`,'Weitere Healthcare-Käufe vermeiden und Abbau/Rebalancing prüfen.',{source:r.healthcareCapPct.source}));
  else out.push(outcome(r.healthcareCapPct.ruleId,'OK',round(hc),r.healthcareCapPct.effectiveValue,'Healthcare liegt innerhalb des Caps.','Keine regelbedingte Aktion.',{source:r.healthcareCapPct.source}));

  if (snapshot.effectiveProfile.cashMode!=='TRACKED') out.push(outcome(r.cashMinPct.ruleId,'UNKNOWN',null,r.cashMinPct.effectiveValue,'Cashtracking ist ausgeschaltet; Cashregel ist nicht prüfbar.','Nur bei gewünschter Vollbuchhaltung Cashtracking aktivieren.',{source:r.cashMinPct.source}));
  else if (snapshot.allocations.cashPct===null) out.push(outcome(r.cashMinPct.ruleId,'UNKNOWN',null,r.cashMinPct.effectiveValue,'Cashquote ist nicht berechenbar.','Bewertungsdaten prüfen.',{source:r.cashMinPct.source}));
  else if (snapshot.allocations.cashPct<r.cashMinPct.effectiveValue) out.push(outcome(r.cashMinPct.ruleId,'WARN',round(snapshot.allocations.cashPct),r.cashMinPct.effectiveValue,'Cashquote liegt unter Minimum.','Liquidität prüfen.',{source:r.cashMinPct.source}));
  else out.push(outcome(r.cashMinPct.ruleId,'OK',round(snapshot.allocations.cashPct),r.cashMinPct.effectiveValue,'Cashquote liegt über Minimum.','Keine regelbedingte Aktion.',{source:r.cashMinPct.source}));

  for (const p of snapshot.positions) {
    if (p.marketValue===null) out.push(outcome(r.minPositionEur.ruleId,'UNKNOWN',null,r.minPositionEur.effectiveValue,`${p.name}: Mindestpositionswert nicht prüfbar.`,'Kurs/Referenzwert ergänzen.',{assetId:p.assetId,source:r.minPositionEur.source}));
    else if (p.marketValue<r.minPositionEur.effectiveValue) out.push(outcome(r.minPositionEur.ruleId,'WARN',round(p.marketValue),r.minPositionEur.effectiveValue,`${p.name}: Position unter Mindestwert.`,'T90/Review: These prüfen; aufstocken oder Exit entscheiden, kein automatischer Verkauf.',{assetId:p.assetId,source:r.minPositionEur.source}));
  }

  const activeWatchlist=state.watchlistEntries.filter(w=>w.status!=='ARCHIVED').length;
  if (activeWatchlist>r.watchlistMax.effectiveValue) out.push(outcome(r.watchlistMax.ruleId,'WARN',activeWatchlist,r.watchlistMax.effectiveValue,'Watchlist-Limit überschritten.','Watchlist bereinigen oder Limit bewusst im Cockpit ändern.',{source:r.watchlistMax.source}));
  else out.push(outcome(r.watchlistMax.ruleId,'OK',activeWatchlist,r.watchlistMax.effectiveValue,'Watchlist innerhalb des Limits.','Keine regelbedingte Aktion.',{source:r.watchlistMax.source}));

  for (const cr of snapshot.effectiveProfile.customRules ?? []) {
    if (cr.template==='MAX_SINGLE_POSITION_PCT') {
      if (!snapshot.totals.allocationBase) out.push(outcome(cr.ruleId,'UNKNOWN',null,cr.value,`${cr.label}: derzeit nicht prüfbar.`,'Bewertungsdaten ergänzen.',{source:'Nutzerregel'}));
      else for (const p of snapshot.positions) {
        if (p.marketValue===null) continue;
        const actual=round(p.marketValue/snapshot.totals.allocationBase*100);
        if (actual>Number(cr.value)) out.push(outcome(cr.ruleId,'WARN',actual,Number(cr.value),`${p.name}: ${cr.label} überschritten.`,'Positionsgröße prüfen; kein automatischer Verkauf.',{assetId:p.assetId,source:'Nutzerregel'}));
      }
    } else if (cr.template==='SECTOR_CAP') {
      if (!snapshot.totals.allocationBase) out.push(outcome(cr.ruleId,'UNKNOWN',null,cr.value,`${cr.label}: derzeit nicht prüfbar.`,'Bewertungsdaten ergänzen.',{source:'Nutzerregel'}));
      else {
        const value=snapshot.positions.filter(p=>String(p.sector??'').toLowerCase()===String(cr.sector??'').toLowerCase()).reduce((sum,p)=>sum+(p.marketValue??0),0);
        const actual=round(value/snapshot.totals.allocationBase*100);
        if (actual>Number(cr.value)) out.push(outcome(cr.ruleId,'WARN',actual,Number(cr.value),`${cr.label}: ${cr.sector} liegt über dem gesetzten Cap.`,'Weitere Käufe in diesem Sektor prüfen/vermeiden.',{source:'Nutzerregel'}));
      }
    }
  }

  for (const p of snapshot.positions) {
    const asset=state.assets.find(a=>a.assetId===p.assetId); const h=getEffectiveHalal(state,asset);
    if (h.status==='H0') out.push(outcome('HALAL.H0.VETO','CRITICAL','H0','H1',`${p.name}: H0 – Hard Veto.`,'Keine Aufstockung; Exit-/Veto-Review nach aktiver HPOS-Regel.',{assetId:p.assetId,halal:h,source:r.halalH0Action.source}));
    else if (h.status==='H2') out.push(outcome(h.ruleId==='ASSET.NVO.H2'?'ASSET.NVO.H2':'HALAL.H2.FREEZE','WARN','H2','H1',`${p.name}: H2 – Freeze/Review${h.conflict?' (Quellenkonflikt)':''}.`,'Nicht aufstocken; Prüfung/Review durchführen.',{assetId:p.assetId,halal:h,source:h.ruleId==='ASSET.NVO.H2'?r.nvoException.source:r.halalH2Action.source}));
    else if (h.status==='UNKNOWN') out.push(outcome('HALAL.STATUS.UNKNOWN','UNKNOWN','UNKNOWN','H1',`${p.name}: Halal-Status unbekannt.`,'Vor Kauf/Aufstockung Halal-Prüfung dokumentieren.',{assetId:p.assetId,halal:h,source:null}));
  }
  return out;
}


/* === core/trigger-engine.mjs === */
const sevRank={CRITICAL:4,WARN:3,UNKNOWN:2,INFO:1,OK:0};
function keyOf(r){return `${r.ruleId}:${r.assetId??'GLOBAL'}`;}
function buildAlerts(state,ruleResults,{now=nowIso()}={}){
  const workflow=new Map((state.alertState??[]).map(s=>[s.alertKey,s]));
  return ruleResults.filter(r=>['CRITICAL','WARN','UNKNOWN'].includes(r.status)).map(r=>{
    const alertKey=keyOf(r), saved=workflow.get(alertKey)??{status:'NEW'};
    const snoozed=saved.status==='SNOOZED' && saved.snoozedUntil && new Date(saved.snoozedUntil)>new Date(now);
    return {alertKey,title:r.message,severity:r.status==='CRITICAL'?'CRITICAL':r.status==='WARN'?'WARN':'INFO',actual:r.actual,target:r.target,ruleId:r.ruleId,reason:r.message,action:r.action,dataAsOf:now,status:saved.status==='SNOOZED'?(snoozed?'SNOOZED':'NEW'):(saved.status??'NEW'),snoozedUntil:saved.snoozedUntil??null,assetId:r.assetId??null,source:r.source??null};
  }).sort((a,b)=>sevRank[b.severity]-sevRank[a.severity] || a.title.localeCompare(b.title));

function setAlertWorkflow(state,alertKey,status,{snoozedUntil=null}={}){
  const allowed=['NEW','REVIEW','SNOOZED','DONE']; if(!allowed.includes(status)) throw new Error('Ungültiger Alert-Status.');

function fmt(v,unit=''){return v===null||v===undefined?'unbekannt':`${v}${unit}`;}
function buildBriefing(state,snapshot,alerts,{previousSnapshot=null}={}){
  const visible=alerts.filter(a=>a.status!=='DONE' && a.status!=='SNOOZED');
  const critical=visible.filter(a=>a.severity==='CRITICAL').length, warn=visible.filter(a=>a.severity==='WARN').length, info=visible.filter(a=>a.severity==='INFO').length;
  const statusText=critical?`🔴 ${critical} kritische von ${visible.length} offenen Punkten; zusätzlich ${warn} Warnung(en).`:warn?`🟠 ${warn} von ${visible.length} offenen Punkten benötigen zuerst Aufmerksamkeit.`:info?`🟡 ${info} offene Punkte sind derzeit nicht vollständig prüfbar.`:'🟢 Keine aktive Regelabweichung aus den vollständig prüfbaren lokalen Daten.';
  const changes=[];
  if(previousSnapshot){
    if(previousSnapshot.allocations?.sukukPct!==snapshot.allocations.sukukPct) changes.push(`Sukuk: ${fmt(previousSnapshot.allocations?.sukukPct,'%')} → ${fmt(snapshot.allocations.sukukPct,'%')}`);
    if(previousSnapshot.totals?.holdingsValue!==snapshot.totals.holdingsValue) changes.push(`Depotwert: ${fmt(previousSnapshot.totals?.holdingsValue,' €')} → ${fmt(snapshot.totals.holdingsValue,' €')}`);
  }
  if(!changes.length) changes.push(previousSnapshot?'Keine belegte relevante Änderung aus den gespeicherten Snapshot-Werten.':'Noch kein Vergleichssnapshot vorhanden.');
  const actionAlerts=visible.filter(a=>['CRITICAL','WARN'].includes(a.severity)).slice(0,5);
  const actions=actionAlerts.map(a=>a.action);
  if(!actions.length) actions.push('Keine konkrete Aktion aus einer aktiven Regelabweichung ableitbar.');
  const chances=[];
  const wl=state.watchlistEntries.filter(w=>w.status!=='ARCHIVED');
  if(wl.length) chances.push(`${wl.length} Watchlist-Kandidat(en) vorhanden; ohne belegten Kurs-/Triggerwert keine Kaufchance behauptet.`); else chances.push('Keine Watchlist-Chance aus lokalen Daten ableitbar.');
  const today=new Date(snapshot.asOf), due=state.reviews.filter(r=>r.status!=='DONE' && r.dueAt && new Date(r.dueAt)<=new Date(today.getTime()+30*86400000));
  const dates=due.length?due.slice(0,5).map(r=>`${r.type}: fällig ${r.dueAt}`):['Keine dokumentierte Review-Fälligkeit in den nächsten 30 Tagen.'];
  return {asOf:snapshot.asOf,traceability:{actions:actionAlerts.map(a=>({alertKey:a.alertKey,ruleId:a.ruleId,actual:a.actual,target:a.target}))},blocks:[
    {id:'status',title:'Status',items:[statusText]},
    {id:'changes',title:'Seit letztem Check',items:changes},
    {id:'actions',title:'Handlungen',items:actions},
    {id:'opportunities',title:'Chancen',items:chances},
    {id:'dates',title:'Termine',items:dates}
  ]};
}

const mapType={Kauf:'BUY',Verkauf:'SELL','Bestandsübernahme':'OPENING_POSITION',Dividende:'DIVIDEND',Einzahlung:'CASH_IN',Auszahlung:'CASH_OUT'};
function migrateV12(v12,{at=nowIso()}={}){
  if(!v12||typeof v12!=='object')return {ok:false,errors:['V1.2-Zustand fehlt oder ist ungültig.']};
  const target=createEmptyState(at); target.appMeta.migrationHistory.push({from:2,to:3,at,status:'STARTED'});

  for(const p of v12.positions??[])ensure(p); for(const t of v12.transactions??[])if(t.symbol)ensure(t); for(const w of v12.watchlist??[])if(w.symbol)ensure(w); for(const h of v12.halal??[])if(h.symbol)ensure(h);
  for(const t of v12.transactions??[]){const type=mapType[t.type];if(!type)continue;const asset=['BUY','SELL','OPENING_POSITION','DIVIDEND'].includes(type)&&t.symbol?ensure(t):null;target.transactions.push({transactionId:t.id??uuid(),type,date:t.date??at.slice(0,10),createdAt:t.createdAt??at,enteredBy:'migration-v1.2',assetId:asset?.assetId,qty:Number(t.qty||0)||undefined,price:Number(t.price||0),amount:Number(t.amount||0)||undefined,legacySource:'v1.2'});}

  for(const p of v12.positions??[]){const a=ensure(p);const cur=snap.positions.find(x=>x.assetId===a.assetId)?.qty??0;const diff=Number(p.qty||0)-cur;if(Math.abs(diff)>1e-9){if(diff>0)target.transactions.unshift({transactionId:uuid(),type:'OPENING_POSITION',date:earliest,createdAt:at,enteredBy:'migration-v1.2-balance',assetId:a.assetId,qty:diff,price:Number(p.avg??p.price??0),legacySource:'v1.2-position-balance'});else target.diagnostics.push({code:'MIGRATION_NEGATIVE_POSITION_DIFF',severity:'WARN',assetId:a.assetId,message:`V1.2 gespeicherter Bestand liegt ${Math.abs(diff)} Stück unter dem aus Journal ableitbaren Bestand; nicht still korrigiert.`});}}
  for(const w of v12.watchlist??[]){const a=ensure(w);target.watchlistEntries.push({watchlistId:uuid(),assetId:a.assetId,bucket:String(w.bucket??'C').startsWith('A')?'A':String(w.bucket??'C').startsWith('B')?'B':'C',thesis:w.note??'',entryTrigger:null,reviewDate:null,createdAt:at,status:'ACTIVE'});}
  for(const h of v12.halal??[]){const a=ensure(h);target.halalChecks.push({checkId:uuid(),assetId:a.assetId,source:h.source||'Legacy v1.2',status:['H1','H2','H0'].includes(h.status)?h.status:'UNKNOWN',checkedAt:h.date||at.slice(0,10),evidenceRef:null,note:'Aus v1.2 migriert',enteredBy:'migration-v1.2',updatedAt:at});}
  target.newsEntries=(v12.news??[]).map(n=>({...n,newsId:n.newsId??uuid(),enteredBy:n.enteredBy??'migration-v1.2',updatedAt:n.updatedAt??at}));
  target.userProfile.cashMode='OFF';
  if(v12.cash!==undefined && Number(v12.cash)!==0)target.diagnostics.push({code:'LEGACY_CASH_PRESERVED_AS_DIAGNOSTIC',severity:'WARN',message:`V1.2 Cash ${Number(v12.cash)} € wurde nicht als aktiver Cashbestand übernommen, weil Cashtracking in v1.3 standardmäßig AUS ist. Wert bleibt im Migrationshinweis erhalten.`,legacyCash:Number(v12.cash)});
  target.dataStatus.portfolio={state:target.transactions.length||target.assets.length?'CURRENT':'UNKNOWN',source:'migration-v1.2',asOf:at,lastAttemptAt:at,message:'Aus V1.2 migriert; Bewertungsdaten können Referenzwerte sein.'};

  target.appMeta.migrationHistory[0].status='COMPLETED';target.appMeta.updatedAt=at;

/* === core/migration-service.mjs === */
const LEGACY_STORAGE_KEY='hposState';
function migrateStorageV12ToV3(storage,{at=nowIso()}={}){
  const raw=storage.getItem(LEGACY_STORAGE_KEY);
  if(raw===null)return {ok:false,kind:'NO_LEGACY',message:'Kein V1.2-Zustand gefunden.'};
  let legacy;
  try{legacy=JSON.parse(raw);}catch(e){return {ok:false,kind:'LEGACY_PARSE_ERROR',message:'V1.2-Daten sind nicht lesbar.',error:String(e)};}
  const backupKey=`${LEGACY_STORAGE_KEY}_backup_${at.replace(/[:.]/g,'-')}`;
  // Sicherung wird angelegt, bevor irgendein Zielzustand geschrieben wird.
  storage.setItem(backupKey,raw);
  const migrated=migrateV12(legacy,{at});
  if(!migrated.ok)return {ok:false,kind:'MIGRATION_ERROR',errors:migrated.errors,backupKey};
  const valid=validateV3State(migrated.state);
  if(!valid.ok)return {ok:false,kind:'TARGET_VALIDATION_ERROR',errors:valid.errors,backupKey};
  // Erst nach erfolgreicher Migration + Validierung wird das produktive v3-Ziel ersetzt.
  storage.setItem(STORAGE_KEY,JSON.stringify(migrated.state));
  return {ok:true,state:migrated.state,backupKey,targetKey:STORAGE_KEY};
}

/* === core/integration-layer.mjs === */
const integrationActiveAlert = a => !['DONE','SNOOZED'].includes(a.status);
const integrationSevRank = {CRITICAL:4,WARN:3,INFO:2,UNKNOWN:1};

function assetName(state, assetId){ return state.assets.find(a=>a.assetId===assetId)?.name ?? 'Unbekannt'; }

function buildAssetInsight(state,snapshot,alerts,assetId){
  const asset=state.assets.find(a=>a.assetId===assetId) ?? null;
  const position=snapshot.positions.find(p=>p.assetId===assetId) ?? null;
  const halal=asset?getEffectiveHalal(state,asset):{status:'UNKNOWN',conflict:false,reason:'Asset fehlt.',checks:[]};
  const assetAlerts=alerts.filter(a=>a.assetId===assetId).sort((a,b)=>(integrationSevRank[b.severity]??0)-(integrationSevRank[a.severity]??0));
  const active=assetAlerts.filter(integrationActiveAlert);
  const snoozed=assetAlerts.filter(a=>a.status==='SNOOZED');
  const watchlist=(state.watchlistEntries??[]).filter(w=>w.assetId===assetId&&w.status!=='ARCHIVED');
  const news=(state.newsEntries??[]).filter(n=>n.assetId===assetId).sort((a,b)=>String(b.publishedAt||b.updatedAt||'').localeCompare(String(a.publishedAt||a.updatedAt||'')));
  const transactions=(state.transactions??[]).filter(t=>t.assetId===assetId).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const allocationBase=Number(snapshot.totals.allocationBase||0);
  const weightPct=position&&position.marketValue!==null&&allocationBase>0?round(position.marketValue/allocationBase*100,2):null;

  const statements=[];
  if(halal.status==='H0') statements.push('H0/Veto ist aktiv. Aufstockung ist ausgeschlossen; Exit-/Veto-Review erforderlich.');
  else if(halal.status==='H2') statements.push(`H2/Freeze ist aktiv${halal.conflict?' wegen Quellenkonflikt':''}. Nicht aufstocken; Review durchführen.`);
  else if(halal.status==='UNKNOWN') statements.push('Halal-Status ist unbekannt. Vor Kauf oder Aufstockung Prüfung dokumentieren.');
  const min=active.find(a=>a.ruleId==='POSITION.MIN.REVIEW');
  if(min) statements.push(`Position liegt mit ${min.actual} € unter dem Mindestwert von ${min.target} €.`);
  const concentration=active.find(a=>String(a.ruleId).startsWith('USER.MAX_SINGLE_POSITION_PCT'));
  if(concentration) statements.push(`Positionsgewicht ${concentration.actual} % überschreitet dein Limit von ${concentration.target} %.`);
  if(news.length) statements.push(`${news.length} gespeicherte News-Meldung${news.length===1?'':'en'} ist/sind diesem Asset zugeordnet.`);
  if(!statements.length) statements.push('Aus den lokal belegten Daten ergibt sich aktuell keine besondere HPOS-Aktion.');

  return {asset,position,halal,alerts:assetAlerts,activeAlerts:active,snoozedAlerts:snoozed,watchlist,news,transactions,weightPct,summary:statements.join(' ')};
}

function buildIntegratedAssetViews(state,snapshot,alerts){
  return snapshot.positions.map(p=>buildAssetInsight(state,snapshot,alerts,p.assetId));
}

function buildDashboardSignals(state,snapshot,alerts,{limit=4}={}){
  const assetSignals=buildIntegratedAssetViews(state,snapshot,alerts)
    .filter(v=>v.activeAlerts.length||v.news.length)
    .map(v=>({
      kind:'ASSET',assetId:v.asset?.assetId,title:v.asset?.name??'Asset',severity:v.activeAlerts.some(a=>a.severity==='CRITICAL')?'CRITICAL':v.activeAlerts.some(a=>a.severity==='WARN')?'WARN':'INFO',summary:v.summary,activeCount:v.activeAlerts.length,newsCount:v.news.length
    }));
  const globalSignals=alerts.filter(a=>!a.assetId&&integrationActiveAlert(a)).map(a=>({kind:'GLOBAL',title:a.title,severity:a.severity,summary:a.action,ruleId:a.ruleId,activeCount:1,newsCount:0}));
  return [...assetSignals,...globalSignals].sort((a,b)=>{
    const sr=(integrationSevRank[b.severity]??0)-(integrationSevRank[a.severity]??0); if(sr)return sr;
    if(a.kind!==b.kind)return a.kind==='GLOBAL'?-1:1;
    return (b.activeCount??0)-(a.activeCount??0);
  }).slice(0,limit);
}

function buildIncomeSummary(state,snapshot,{year=new Date().getFullYear()}={}){
  const dividends=(state.transactions??[]).filter(t=>t.type==='DIVIDEND'&&String(t.date||'').startsWith(String(year)));
  const monthly=Array.from({length:12},()=>0);
  const byAsset=new Map();
  for(const t of dividends){
    const d=new Date(`${t.date}T00:00:00`); if(Number.isNaN(d.getTime())) continue;
    const amount=Number(t.amount||0); if(!Number.isFinite(amount)) continue;
    monthly[d.getMonth()]+=amount;
    const key=t.assetId??'UNASSIGNED'; byAsset.set(key,(byAsset.get(key)||0)+amount);
  }
  const received=monthly.reduce((s,v)=>s+v,0);
  const now=new Date(); const elapsed=year===now.getFullYear()?now.getMonth()+1:12;
  const monthlyAverage=elapsed?received/elapsed:0;
  const goal=Number(snapshot.effectiveProfile.rules.dividendGoalNetMonthlyEur.effectiveValue||0);
  const goalProgressPct=goal>0?round(Math.min(100,monthlyAverage/goal*100),1):null;
  const distribution=[...byAsset.entries()].map(([assetId,amount])=>({assetId,name:assetId==='UNASSIGNED'?'Ohne Zuordnung':assetName(state,assetId),amount,sharePct:received>0?round(amount/received*100,1):0})).sort((a,b)=>b.amount-a.amount);
  const recent=[...dividends].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8).map(t=>({transactionId:t.transactionId,date:t.date,assetId:t.assetId??null,name:t.assetId?assetName(state,t.assetId):'Ohne Zuordnung',amount:Number(t.amount||0)}));
  return {year,received,monthly,monthlyAverage,goal,goalProgressPct,distribution,recent,count:dividends.length,basis:'RECORDED_DIVIDEND_TRANSACTIONS'};
}

function init(){
  const loaded=loadState(localStorage);
  if(loaded.ok){state=loaded.state;previousSnapshot=state.userProfile.ui?.lastSnapshot??null;}
  else if(loaded.kind==='EMPTY'){
    const mig=migrateStorageV12ToV3(localStorage);
    if(mig.ok){state=mig.state;toast('V1.2-Daten sicher nach v1.3 migriert');}
    else if(mig.kind==='NO_LEGACY'){state=createEmptyState();persist();}
    else{loadProblem=mig;}
  }else{loadProblem=loaded;}
  if(loadProblem){renderFatal();return;}
  state.appMeta.appVersion=APP_VERSION;
  recompute();renderNav();route(location.hash.slice(1)||'dashboard',false);rememberSnapshot();registerSW();
}

function renderFatal(){
  $('#main').innerHTML=`<div class="section-head"><div><h1>HPOS konnte lokale Daten nicht sicher laden</h1><p>Es wurde nichts überschrieben.</p></div></div><div class="card"><div class="notice error"><strong>${esc(loadProblem?.kind||'FEHLER')}</strong><p>${esc(loadProblem?.message||'Unbekannter Ladefehler')}</p></div><div class="action-row"><button class="btn" id="downloadRaw">Rohdaten sichern</button><button class="btn danger" id="freshStart">Lokalen Neustart erzwingen</button></div><p class="rule-source">Ein Neustart löscht den aktuell fehlerhaften lokalen HPOS-Zustand. Vorher Rohdaten sichern.</p></div>`;
  $('#downloadRaw')?.addEventListener('click',()=>downloadText('HPOS_Rohdaten_Fehler.txt',loadProblem.raw||JSON.stringify(loadProblem,null,2),'text/plain'));
  $('#freshStart')?.addEventListener('click',()=>{if(confirm('Lokalen HPOS-Zustand wirklich neu anlegen?')){localStorage.removeItem('hposStateV3');location.reload();}});
}

function registerSW(){ /* single-file Safari-Test: Service Worker bewusst deaktiviert */ }
function renderNav(){
  const activeAlerts=alerts.filter(a=>!['DONE','SNOOZED'].includes(a.status)).length;
  $('#nav').innerHTML=NAV.map(([id,ic,label])=>`<button class="nav-btn ${currentPage===id?'active':''}" data-route="${id}"><span>${ic}</span><span>${label}</span>${id==='radar'&&activeAlerts?`<span class="nav-count">${activeAlerts}</span>`:''}</button>`).join('');
  $$('.nav-btn').forEach(b=>b.onclick=()=>route(b.dataset.route));
}
function route(page,push=true){
  if(!TITLES[page])page='dashboard';currentPage=page;if(push)history.replaceState(null,'',`#${page}`);
  const [t,s]=TITLES[page];$('#pageTitle').textContent=t;$('#pageSubtitle').textContent=s;closeDrawer();renderNav();
  const fn={dashboard:renderDashboard,portfolio:renderPortfolio,radar:renderRadar,watchlist:renderWatchlist,news:renderNews,income:renderIncome,more:renderMore,halal:renderHalal,strategy:renderStrategy,transactions:renderTransactions,data:renderData,diagnostics:renderDiagnostics,asset:renderAssetDetail}[page];
  fn();$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});
}

function closeDrawer(){ $('#drawer').classList.remove('open');$('#backdrop').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');}
$('#menuBtn').onclick=openDrawer;$('#drawerClose').onclick=closeDrawer;$('#backdrop').onclick=closeDrawer;

function dataStateBadge(ds){const c=ds.state==='CURRENT'?'good':ds.state==='STALE'?'warn':ds.state==='ERROR'?'bad':'info';return `<span class="badge ${c}">${esc(ds.state)}</span>`;}
function statusClass(s){return s==='CRITICAL'||s==='H0'?'bad':s==='WARN'||s==='H2'?'warn':s==='H1'||s==='OK'?'good':'info';}
function friendlyDataState(s){return s==='CURRENT'?'Aktuell':s==='STALE'?'Prüfen':s==='ERROR'?'Fehler':'Unbekannt';}
function renderDataStrip(){return `<div class="data-status-card card">${['portfolio','prices','halal','news'].map(k=>{const d=state.dataStatus[k],label=k==='portfolio'?'Portfolio':k==='prices'?'Kurse':k==='halal'?'Halal':'News';return `<div class="data-status-row"><div><strong>${label}</strong><small>${esc(d.message||'')}</small></div><span class="badge ${d.state==='CURRENT'?'good':d.state==='STALE'?'warn':d.state==='ERROR'?'bad':'info'}">${friendlyDataState(d.state)}</span></div>`}).join('')}</div>`;}

function linkedSignalCard(s){const c=s.severity==='CRITICAL'?'critical':s.severity==='WARN'?'warn':'info';return `<button class="card linked-signal ${c}" ${s.assetId?`data-signal-asset="${esc(s.assetId)}"`:''}><div><span class="badge ${statusClass(s.severity)}">${esc(s.severity)}</span><strong>${esc(s.title)}</strong><p>${esc(s.summary)}</p></div><span class="chev">${s.assetId?'›':''}</span></button>`;}
function metric(label,value,sub){return `<div class="card metric"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="sub">${esc(sub)}</div></div>`;}
function alertCard(a,{workflow=true}={}){
  const isSnoozed=a.status==='SNOOZED', isCritical=a.severity==='CRITICAL';
  const statusLabel=isSnoozed&&a.snoozedUntil?`Zurückgestellt bis ${dateFmt(a.snoozedUntil)}`:a.status==='REVIEW'?'In Prüfung':a.status==='DONE'?'Erledigt':a.status;
  const actions=!workflow?'':isSnoozed?`<div class="action-row"><button class="btn small" data-alert-act="NEW">Wieder aktivieren</button></div>`:`<div class="action-row"><button class="btn small" data-alert-act="REVIEW">Prüfen</button>${isCritical?'':`<button class="btn small" data-alert-act="SNOOZED">Zurückstellen</button>`}<button class="btn small" data-alert-act="DONE">Erledigt</button></div>`;
  return `<div class="card action-card ${a.severity.toLowerCase()}" data-alert="${esc(a.alertKey)}"><div class="top"><div><span class="badge ${statusClass(a.severity)}">${esc(a.severity)}</span><h3 style="margin-top:9px">${esc(a.title)}</h3></div><span class="badge">${esc(statusLabel)}</span></div><p>${esc(a.action)}</p><details class="rule-details"><summary>Warum?</summary><div class="rule-source">Regel ${esc(a.ruleId)} · Ist ${esc(a.actual??'unbekannt')} · Soll ${esc(a.target??'unbekannt')}</div></details>${actions}</div>`;
}
function bindAlertButtons(){ $$('[data-alert]').forEach(card=>{$$('[data-alert-act]',card).forEach(b=>b.onclick=()=>{const status=b.dataset.alertAct;const opts=status==='SNOOZED'?{snoozedUntil:new Date(Date.now()+30*86400000).toISOString()}:{};setAlertWorkflow(state,card.dataset.alert,status,opts);persist();recompute();toast(status==='SNOOZED'?'30 Tage zurückgestellt':status==='DONE'?'Erledigt':status==='NEW'?'Wieder aktiviert':'Zur Prüfung markiert');route(currentPage,false);});});}

function renderAssetTab(v,tab){const p=v.position,a=v.asset,h=v.halal;
  if(tab==='overview')return `<div class="grid metrics">${metric('Wert',p?eur(p.marketValue):'—',p?.valuationSource==='PRICE_QUOTE'?'bestätigter Kurs':'Referenzwert')}${metric('Gewichtung',v.weightPct===null?'—':pct(v.weightPct),'am bewertbaren Portfolio')}${metric('Halal',h.status,h.conflict?'Quellenkonflikt':'effektiver Status')}${metric('Offene Hinweise',String(v.activeAlerts.length),'für dieses Asset')}</div><div class="card insight-card" style="margin-top:12px"><h3>HPOS Einordnung</h3><p>${esc(v.summary)}</p></div><div class="card" style="margin-top:12px"><div class="details"><div class="kv"><span>Stück</span><strong>${p?Number(p.qty).toLocaleString('de-DE'):'—'}</strong></div><div class="kv"><span>Ø Einstand</span><strong>${p?eur(p.avgCost):'—'}</strong></div><div class="kv"><span>Bewertung</span><strong>${p?eur(p.valuationPrice):'—'}</strong></div><div class="kv"><span>Datenstand</span><strong>${p?esc(dateFmt(p.priceAsOf)):'—'}</strong></div></div>${p?`<div class="action-row"><button class="btn small" data-price-detail>Kurs aktualisieren</button></div>`:''}</div>`;
  if(tab==='hpos')return `<div class="stack">${v.alerts.length?v.alerts.map(x=>alertCard(x)).join(''):`<div class="card empty">Keine assetbezogenen HPOS-Hinweise.</div>`}</div>`;
  if(tab==='halal'){const checks=state.halalChecks.filter(c=>c.assetId===a.assetId).sort((x,y)=>String(y.checkedAt).localeCompare(String(x.checkedAt)));return `<div class="card"><div class="top"><div><h3>Effektiver Status</h3><p>${esc(h.reason)}</p></div><span class="badge ${statusClass(h.status)}">${esc(h.status)}</span></div>${checks.length?checks.map(c=>`<div class="list-row"><div class="top"><div><strong>${esc(c.source)}</strong><div class="sub">${esc(dateFmt(c.checkedAt))}</div></div><span class="badge ${statusClass(c.status)}">${esc(c.status)}</span></div>${c.evidenceRef?`<div class="rule-source">Beleg: ${esc(c.evidenceRef)}</div>`:''}</div>`).join(''):`<div class="empty">Noch keine Halal-Prüfung hinterlegt.</div>`}<div class="action-row"><button class="btn primary small" data-add-halal>＋ Prüfung erfassen</button></div></div>`;}
  if(tab==='activities')return `<div class="card">${v.transactions.length?v.transactions.map(t=>txRow(t,{deletable:false})).join(''):`<div class="empty">Noch keine Aktivitäten zu diesem Asset.</div>`}</div>`;
  if(tab==='news')return `<div class="section-head"><div><h2>News</h2><p>${v.news.length} gespeicherte Meldung${v.news.length===1?'':'en'}</p></div><button class="btn primary small" data-add-news>＋ Meldung</button></div><div class="stack">${v.news.length?v.news.map(newsCard).join(''):`<div class="card empty">Keine belegte News zu diesem Asset gespeichert.</div>`}</div>`;
  return '';
}

function renderRadar(){
  recompute();
  const active=alerts.filter(a=>!['DONE','SNOOZED'].includes(a.status));
  const snoozed=alerts.filter(a=>a.status==='SNOOZED');
  const done=alerts.filter(a=>a.status==='DONE');
  $('#main').innerHTML=`<div class="section-head"><div><h1>Radar</h1><p>${active.length} aktiv · ${snoozed.length} zurückgestellt · jede Meldung ist rückverfolgbar</p></div></div><div class="stack">${active.length?active.map(a=>alertCard(a)).join(''):`<div class="card empty"><div class="emoji">◎</div>Keine aktiven Trigger.</div>`}</div>${snoozed.length?`<details style="margin-top:14px"><summary>Zurückgestellt (${snoozed.length})</summary><div class="stack" style="margin-top:10px">${snoozed.map(a=>alertCard(a)).join('')}</div></details>`:''}${done.length?`<details style="margin-top:14px"><summary>Erledigte Hinweise (${done.length})</summary><div class="stack" style="margin-top:10px">${done.map(a=>alertCard(a,{workflow:false})).join('')}</div></details>`:''}`;bindAlertButtons();
}

function renderStrategy(){

  $('#main').innerHTML=`<div class="section-head"><div><h1>Strategie-Cockpit</h1><p>HPOS Standard bleibt unverändert. Du änderst nur Overrides.</p></div><button class="btn" id="resetStrategy">HPOS Standard</button></div>

    ${rangeSetting('sukukTargetPct','Sukuk-Ziel',r.sukukTargetPct,0,40,1,'%')}
    ${rangeSetting('healthcareCapPct','Healthcare-Maximum',r.healthcareCapPct,0,60,1,'%')}
    ${rangeSetting('cashMinPct','Cash-Mindestquote',r.cashMinPct,0,20,1,'%')}
    <div class="setting"><div class="setting-head"><div><strong>Cashtracking</strong><div class="standard-note">App-Standard: AUS</div></div><select id="cashMode"><option value="OFF" ${eff.cashMode==='OFF'?'selected':''}>AUS</option><option value="TRACKED" ${eff.cashMode==='TRACKED'?'selected':''}>TRACKED</option></select></div><div class="field-help">Nur TRACKED führt Verrechnungscash und aktiviert die Cashregel.</div></div>
    ${numberSetting('minPositionEur','Mindestpositionswert',r.minPositionEur,'€',10)}
    ${numberSetting('watchlistMax','Watchlist-Maximum',r.watchlistMax,'Titel',1)}
    ${numberSetting('dividendGoalNetMonthlyEur','Dividendenziel netto / Monat',r.dividendGoalNetMonthlyEur,'€',5)}

    <div id="impactPreview" class="impact"><h4>Auswirkung</h4><p>Ändere einen Wert. HPOS berechnet die Wirkung vor dem Speichern.</p></div>
    <div class="action-row"><button class="btn primary" type="submit">Änderungen übernehmen</button></div>
  </form>`;
  $('#strategyForm').addEventListener('input',renderImpactPreview);$('#strategyForm').onsubmit=e=>{e.preventDefault();applyStrategyForm();};$('#customRuleAdd').onclick=()=>openCustomRuleForm();bindCustomRuleDelete();$('#resetStrategy').onclick=()=>{if(confirm('Alle persönlichen Strategie-Overrides auf HPOS Standard zurücksetzen?')){resetAllOverrides(state);state.userProfile.cashMode=state.standardProfile.productDefaults.cashMode.value;persist();recompute();toast('HPOS Standard wiederhergestellt');renderStrategy();}};renderImpactPreview();

function rangeSetting(key,label,r,min,max,step,unit){return `<div class="setting"><div class="setting-head"><div><strong>${esc(label)}</strong><div class="standard-note">Standard ${esc(r.standardValue)}${unit} ${r.overridden?'<span class="override-dot">· geändert</span>':''}</div></div><span class="setting-value" id="${key}Val">${esc(r.effectiveValue)}${unit}</span></div><input data-strategy="${key}" id="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${esc(r.effectiveValue)}"></div>`;}
function numberSetting(key,label,r,unit,step){return `<div class="setting"><div class="setting-head"><div><strong>${esc(label)}</strong><div class="standard-note">Standard ${esc(r.standardValue)} ${unit} ${r.overridden?'<span class="override-dot">· geändert</span>':''}</div></div><input data-strategy="${key}" id="${key}" type="number" min="0" step="${step}" value="${esc(r.effectiveValue)}" style="width:92px"></div></div>`;}
function sourceOptions(sel){return ['Musaffa','Zoya','Sharlife'].map(x=>`<option value="${x}" ${x===sel?'selected':''}>${x}</option>`).join('');}
function strategyDraft(){const d=clone(state);for(const k of ['sukukTargetPct','healthcareCapPct','cashMinPct','minPositionEur','watchlistMax','dividendGoalNetMonthlyEur']){const el=$(`#${k}`);if(el)setOverride(d,k,Number(el.value));}setOverride(d,'dividendGoalDate',$('#dividendGoalDate').value);d.userProfile.cashMode=$('#cashMode').value;const s1=$('#source1')?.value,s2=$('#source2')?.value;if(s1&&s2&&s1===s2)throw new Error('Halal-Quelle 1 und 2 müssen unterschiedlich sein.');d.userProfile.halalSourcePriority=[...new Set([s1,s2].filter(Boolean))];d.userProfile.halalConflictPolicy=$('#conflictPolicy')?.value||'CONFLICT_TO_H2';return d;}
function renderImpactPreview(){try{for(const k of ['sukukTargetPct','healthcareCapPct','cashMinPct']){const el=$(`#${k}`),v=$(`#${k}Val`);if(el&&v)v.textContent=`${el.value}%`;}const d=strategyDraft(),s2=buildSnapshot(d),r2=evaluateRules(d,s2),a2=buildAlerts(d,r2);const before=alerts.filter(a=>!['DONE','SNOOZED'].includes(a.status)).length,after=a2.filter(a=>!['DONE','SNOOZED'].includes(a.status)).length;const changes=[];const labels={sukukTargetPct:'Sukuk-Ziel',healthcareCapPct:'Healthcare-Maximum',cashMinPct:'Cash-Mindestquote',minPositionEur:'Mindestpositionswert',watchlistMax:'Watchlist-Maximum',dividendGoalNetMonthlyEur:'Dividendenziel',dividendGoalDate:'Dividenden-Zieldatum'};for(const k of Object.keys(labels)){const a=snapshot.effectiveProfile.rules[k]?.effectiveValue,b=s2.effectiveProfile.rules[k]?.effectiveValue;if(JSON.stringify(a)!==JSON.stringify(b))changes.push(`${labels[k]}: ${Array.isArray(a)?a.join(' → '):a} → ${Array.isArray(b)?b.join(' → '):b}`);}if(snapshot.effectiveProfile.cashMode!==s2.effectiveProfile.cashMode)changes.push(`Cashtracking: ${snapshot.effectiveProfile.cashMode} → ${s2.effectiveProfile.cashMode}`);const oldPriority=snapshot.effectiveProfile.rules.halalSourcePriority.effectiveValue,newPriority=s2.effectiveProfile.rules.halalSourcePriority.effectiveValue;if(JSON.stringify(oldPriority)!==JSON.stringify(newPriority))changes.push(`Halal-Priorität: ${oldPriority.join(' → ')} → ${newPriority.join(' → ')}`);if(snapshot.effectiveProfile.halalConflictPolicy!==s2.effectiveProfile.halalConflictPolicy)changes.push(`Konfliktregel: ${snapshot.effectiveProfile.halalConflictPolicy} → ${s2.effectiveProfile.halalConflictPolicy}`);if(before!==after)changes.push(`Offene Regelhinweise: ${before} → ${after}`);$('#impactPreview').innerHTML=changes.length?`<h4>Auswirkung vor Speichern</h4><ul>${changes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="field-help">Aktuelle Sukukquote: ${pct(s2.allocations.sukukPct)}</p>`:`<h4>Keine ungespeicherte Änderung</h4><p>Die angezeigten Werte entsprechen der aktuell gespeicherten Strategie.</p>`;}catch(e){$('#impactPreview').innerHTML=`<h4>Auswirkung</h4><p>Vorschau derzeit nicht berechenbar: ${esc(e.message)}</p>`;}}
function applyStrategyForm(){try{const d=strategyDraft();state.userProfile=d.userProfile;persist();recompute();toast('Strategie aktualisiert');renderStrategy();renderNav();}catch(e){toast(e.message);}}

const ACTIONS={
  BUY:['Kauf','Wertpapier kaufen'],SELL:['Verkauf','Bestand reduzieren'],OPENING_POSITION:['Bestand übernehmen','Bestehenden Bestand ohne Cash erfassen'],DIVIDEND:['Dividende','Ausschüttung erfassen'],CASH_IN:['Einzahlung','Cash hinzufügen'],CASH_OUT:['Auszahlung','Cash reduzieren'],WATCHLIST:['Watchlist-Kandidat','Titel beobachten'],HALAL:['Halal-Prüfung','Quelle und Status dokumentieren'],NEWS:['News-Meldung','Quelle und Asset verknüpfen']
};
function openActionSheet(only=null){const keys=only||Object.keys(ACTIONS);openModal('Neuer Eintrag',`<div class="action-sheet">${keys.map(k=>`<button class="action-choice" data-action="${k}"><strong>${ACTIONS[k][0]}</strong><small>${ACTIONS[k][1]}</small></button>`).join('')}</div>`);$$('[data-action]').forEach(b=>b.onclick=()=>openEntryModal(b.dataset.action));}
function openModal(title,body){$('#modalRoot').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-modal-close>×</button></div>${body}</div></div>`;$('[data-modal-close]').onclick=closeModal;$('.modal-wrap').onclick=e=>{if(e.target.classList.contains('modal-wrap'))closeModal();};}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function assetFields({allowNew=true}={}){const opts=state.assets.map(a=>`<option value="${esc(a.assetId)}">${esc(a.name)}${a.ticker?` · ${esc(a.ticker)}`:''}</option>`).join('');return `<div class="field"><label>Wertpapier</label><select id="assetSelect"><option value="">${allowNew?'Neues Wertpapier anlegen':'Bitte wählen'}</option>${opts}</select></div>${allowNew?`<div id="newAssetFields"><div class="field"><label>Name</label><input id="assetName" placeholder="z. B. Rio Tinto"></div><div class="two"><div class="field"><label>Ticker</label><input id="assetTicker" placeholder="RIO"></div><div class="field"><label>ISIN</label><input id="assetIsin" placeholder="optional"></div></div><div class="two"><div class="field"><label>Assetklasse</label><select id="assetClass"><option>Equity</option><option>Sukuk</option><option>ETF</option><option>Fund</option><option>Other</option></select></div><div class="field"><label>Sektor</label><input id="assetSector" placeholder="optional"></div></div></div>`:''}`;}
function bindAssetToggle(){const s=$('#assetSelect'),n=$('#newAssetFields');if(s&&n){const f=()=>n.classList.toggle('hide',!!s.value);s.onchange=f;f();}}
function resolveAsset(){const selected=$('#assetSelect')?.value;if(selected)return state.assets.find(a=>a.assetId===selected);const name=$('#assetName')?.value?.trim();if(!name)throw new Error('Name des Wertpapiers fehlt.');return upsertAsset(state,{name,ticker:$('#assetTicker')?.value?.trim()||undefined,isin:$('#assetIsin')?.value?.trim()||undefined,assetClass:$('#assetClass')?.value||'UNKNOWN',sector:$('#assetSector')?.value?.trim()||undefined,currency:'EUR'});}
function openEntryModal(type){
  if(type==='WATCHLIST')return openWatchlistForm();if(type==='HALAL')return openHalalForm();if(type==='NEWS')return openNewsForm();
  const assetRelated=['BUY','SELL','OPENING_POSITION','DIVIDEND'].includes(type);const moneyOnly=['CASH_IN','CASH_OUT'].includes(type);
  openModal(ACTIONS[type][0],`<form id="entryForm" class="form">${assetRelated?assetFields({allowNew:type!=='SELL'&&type!=='DIVIDEND'}):''}<div class="field"><label>Datum</label><input id="txDate" type="date" value="${isoDate()}"></div>${['BUY','SELL','OPENING_POSITION'].includes(type)?`<div class="two"><div class="field"><label>Stückzahl</label><input id="txQty" type="number" min="0.000001" step="any" inputmode="decimal"></div><div class="field"><label>Preis je Stück</label><input id="txPrice" type="number" min="0" step="any" inputmode="decimal"></div></div>`:''}${type==='DIVIDEND'||moneyOnly?`<div class="field"><label>Betrag</label><input id="txAmount" type="number" min="0.01" step="0.01" inputmode="decimal"></div>`:''}${type==='BUY'&&snapshot.effectiveProfile.cashMode==='TRACKED'?`<div class="notice warn">Cashtracking ist aktiv. Käufe werden gegen verfügbares Cash geprüft.</div>`:''}<button class="btn primary" type="submit">Speichern</button></form>`);bindAssetToggle();$('#entryForm').onsubmit=e=>{e.preventDefault();try{const a=assetRelated?resolveAsset():null;const tx={type,date:$('#txDate').value,assetId:a?.assetId};if(['BUY','SELL','OPENING_POSITION'].includes(type)){tx.qty=Number($('#txQty').value);tx.price=Number($('#txPrice').value);}else tx.amount=Number($('#txAmount').value);const r=addTransaction(state,tx);if(!r.ok)throw new Error(r.errors.join(' | '));state.dataStatus.portfolio={state:'CURRENT',source:'local',asOf:new Date().toISOString(),lastAttemptAt:new Date().toISOString(),message:'Lokale Ereignisse aktualisiert.'};persist();recompute();closeModal();toast(`${ACTIONS[type][0]} gespeichert`);route(type==='DIVIDEND'?'income':type.startsWith('CASH')?'transactions':'portfolio',false);}catch(err){toast(err.message);}};
}
function openWatchlistForm(){openModal('Watchlist-Kandidat',`<form id="watchForm" class="form">${assetFields()}<div class="two"><div class="field"><label>Lager</label><select id="watchBucket"><option value="A">A · Engpass</option><option value="B">B · Compounder</option><option value="C">C · Spezialfall</option></select></div><div class="field"><label>Review</label><input id="watchReview" type="date"></div></div><div class="field"><label>Einstiegs-/Beobachtungstrigger</label><input id="watchTrigger" placeholder="z. B. unter 80 €"></div><div class="field"><label>Investmentthese / Notiz</label><textarea id="watchThesis" placeholder="Warum ist der Titel interessant?"></textarea></div><button class="btn primary" type="submit">Zur Watchlist</button></form>`);bindAssetToggle();$('#watchForm').onsubmit=e=>{e.preventDefault();try{const limit=getEffectiveProfile(state).rules.watchlistMax.effectiveValue;if(state.watchlistEntries.filter(w=>w.status!=='ARCHIVED').length>=limit)throw new Error(`Watchlist-Limit ${limit} erreicht. Im Strategie-Cockpit bewusst erhöhen oder bereinigen.`);const a=resolveAsset();state.watchlistEntries.push({watchlistId:crypto.randomUUID(),assetId:a.assetId,bucket:$('#watchBucket').value,thesis:$('#watchThesis').value,entryTrigger:$('#watchTrigger').value||null,reviewDate:$('#watchReview').value||null,createdAt:new Date().toISOString(),status:'ACTIVE'});persist();recompute();closeModal();toast('Watchlist-Kandidat gespeichert');route('watchlist',false);}catch(err){toast(err.message);}};}
function openHalalForm(assetId=null){openModal('Halal-Prüfung',`<form id="halalForm" class="form">${assetFields()}<div class="two"><div class="field"><label>Quelle</label><select id="halalSource"><option>Zoya</option><option>Musaffa</option><option>Sharlife</option><option>Manuell</option></select></div><div class="field"><label>Status</label><select id="halalStatus"><option>H1</option><option>H2</option><option>H0</option><option>UNKNOWN</option></select></div></div><div class="field"><label>Prüfdatum</label><input id="halalDate" type="date" value="${isoDate()}"></div><div class="field"><label>Beleg / Referenz</label><input id="halalEvidence" placeholder="URL, Screenshot, Notiz-ID ..."></div><div class="field"><label>Notiz</label><textarea id="halalNote"></textarea></div><button class="btn primary" type="submit">Prüfung speichern</button></form>`);bindAssetToggle();if(assetId&&$('#assetSelect')){$('#assetSelect').value=assetId;$('#assetSelect').dispatchEvent(new Event('change'));}$('#halalForm').onsubmit=e=>{e.preventDefault();try{const a=resolveAsset();state.halalChecks.push({checkId:crypto.randomUUID(),assetId:a.assetId,source:$('#halalSource').value,status:$('#halalStatus').value,checkedAt:$('#halalDate').value,evidenceRef:$('#halalEvidence').value||null,note:$('#halalNote').value||null,enteredBy:'user',updatedAt:new Date().toISOString()});const activeAssetIds=new Set(buildSnapshot(state).positions.map(p=>p.assetId));const allChecked=[...activeAssetIds].every(id=>getEffectiveHalal(state,state.assets.find(x=>x.assetId===id)).status!=='UNKNOWN');state.dataStatus.halal={state:allChecked&&activeAssetIds.size?'CURRENT':'STALE',source:'manual',asOf:$('#halalDate').value,lastAttemptAt:new Date().toISOString(),message:allChecked&&activeAssetIds.size?'Alle aktiven Positionen besitzen einen effektiven Halal-Status.':'Manuelle Prüfungen vorhanden; mindestens eine aktive Position ist noch nicht vollständig bewertet.'};persist();recompute();closeModal();toast('Halal-Prüfung gespeichert');if(assetId){currentAssetId=a.assetId;currentAssetTab='halal';renderAssetDetail();}else route('halal',false);}catch(err){toast(err.message);}};}
function openPriceForm(assetId){const a=state.assets.find(x=>x.assetId===assetId);if(!a)return;openModal('Kurs aktualisieren',`<form id="priceForm" class="form"><div class="notice info"><strong>${esc(a.name)}</strong><p>Manueller Kurs. HPOS kennzeichnet die Quelle sichtbar.</p></div><div class="field"><label>Kurs</label><input id="priceValue" type="number" min="0" step="any" inputmode="decimal" value="${esc(a.priceQuote?.price??'')}"></div><div class="field"><label>Stand</label><input id="priceDate" type="datetime-local"></div><button class="btn primary" type="submit">Kurs speichern</button></form>`);$('#priceForm').onsubmit=e=>{e.preventDefault();const price=Number($('#priceValue').value);if(!Number.isFinite(price)||price<0)return toast('Gültigen Kurs eingeben');a.priceQuote={price,asOf:$('#priceDate').value?new Date($('#priceDate').value).toISOString():new Date().toISOString(),source:'manual',enteredBy:'user'};recompute();state.dataStatus.prices={state:snapshot.completeness.hasCurrentQuotes?'CURRENT':'STALE',source:'manual',asOf:a.priceQuote.asOf,lastAttemptAt:new Date().toISOString(),message:snapshot.completeness.hasCurrentQuotes?'Alle aktiven Positionen besitzen einen bestätigten manuellen Kurs.':'Kurse nur teilweise manuell aktualisiert.'};persist();recompute();closeModal();toast('Kurs gespeichert');if(currentPage==='asset'&&currentAssetId===assetId)renderAssetDetail();else renderPortfolio();};}

function customRuleRows(rows){if(!rows.length)return '<div class="field-help">Keine Zusatzregel aktiv.</div>';return rows.map(r=>`<div class="list-row"><div class="top"><div><strong>${esc(r.label)}</strong><div class="sub">${esc(r.template==='MAX_SINGLE_POSITION_PCT'?'Max. Einzelposition':`Sektor-Cap ${r.sector||''}`)} · ${pct(r.value)}</div></div><button type="button" class="btn small danger" data-custom-rule-del="${esc(r.ruleId)}">Löschen</button></div></div>`).join('');}
function bindCustomRuleDelete(){ $$('[data-custom-rule-del]').forEach(b=>b.onclick=()=>{state.userProfile.customRules=(state.userProfile.customRules||[]).filter(r=>r.ruleId!==b.dataset.customRuleDel);persist();recompute();toast('Zusatzregel gelöscht');renderStrategy();});}
function openCustomRuleForm(){openModal('Eigene Zusatzregel',`<form id="customRuleForm" class="form"><div class="field"><label>Vorlage</label><select id="customTemplate"><option value="MAX_SINGLE_POSITION_PCT">Maximale Einzelposition</option><option value="SECTOR_CAP">Sektor-Maximum</option></select></div><div class="field"><label>Name</label><input id="customLabel" value="Maximale Einzelposition"></div><div class="field hide" id="customSectorWrap"><label>Sektor</label><input id="customSector" placeholder="z. B. Technology"></div><div class="field"><label>Grenzwert in %</label><input id="customValue" type="number" min="1" max="100" step="1" value="20"></div><div class="notice info">Zusatzregeln stammen vom Nutzer und werden als solche gekennzeichnet. Sie verändern keine HPOS-Originalregel.</div><button class="btn primary" type="submit">Regel hinzufügen</button></form>`);const t=$('#customTemplate'),w=$('#customSectorWrap'),l=$('#customLabel');t.onchange=()=>{const sec=t.value==='SECTOR_CAP';w.classList.toggle('hide',!sec);l.value=sec?'Sektor-Maximum':'Maximale Einzelposition';};$('#customRuleForm').onsubmit=e=>{e.preventDefault();const template=t.value,value=Number($('#customValue').value),sector=$('#customSector').value.trim();if(!Number.isFinite(value)||value<=0||value>100)return toast('Grenzwert muss zwischen 1 und 100 % liegen');if(template==='SECTOR_CAP'&&!sector)return toast('Sektor fehlt');state.userProfile.customRules=state.userProfile.customRules||[];state.userProfile.customRules.push({ruleId:`USER.${template}.${crypto.randomUUID()}`,type:'USER_CUSTOM',template,label:$('#customLabel').value.trim()||'Zusatzregel',value,sector:template==='SECTOR_CAP'?sector:null,active:true,createdAt:new Date().toISOString()});persist();recompute();closeModal();toast('Zusatzregel hinzugefügt');renderStrategy();};}

function openAiHandoff(){recompute();const h=buildAiHandoff(state,snapshot,alerts);openModal('Mit ChatGPT analysieren',`<div class="stack"><div class="notice info">HPOS sendet nichts automatisch. Du kopierst den strukturierten Analyseauftrag bewusst.</div>${h.missing.length?`<div class="notice warn"><strong>Fehlend / veraltet</strong><ul>${h.missing.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'<div class="notice info">Keine fehlenden Daten vom Handoff-Builder erkannt.</div>'}<div class="action-row"><button class="btn primary" id="copyPrompt">Analyseauftrag kopieren</button></div></div>`);$('#copyPrompt').onclick=async()=>{try{await navigator.clipboard.writeText(h.prompt);toast('Analyseauftrag kopiert');closeModal();}catch(e){openModal('Analyseauftrag',`<div class="field"><textarea style="min-height:55vh">${esc(h.prompt)}</textarea></div>`);}};}
function downloadText(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

window.addEventListener('hashchange',()=>route(location.hash.slice(1)||'dashboard',false));
init();

</script>
</body>
</html>
