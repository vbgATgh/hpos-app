<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HPOS">
  <title>HPOS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div class="brand-mark">H</div>
        <div><strong>HPOS</strong><small>Local Analyst</small></div>
        <button id="drawerClose" class="icon-btn" aria-label="Menü schließen">×</button>
      </div>
      <nav id="nav" class="nav-list"></nav>
      <div class="drawer-foot">
        <div id="storageBadge" class="status-line">Lokal · Schema v3</div>
        <small>Keine Server · keine API-Pflicht</small>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menü öffnen">☰</button>
      <div class="top-title"><strong id="pageTitle">Dashboard</strong><small id="pageSubtitle">HPOS Briefing</small></div>
      <div class="top-actions">
        <button id="aiBtn" class="icon-btn" aria-label="Mit ChatGPT analysieren" title="Mit ChatGPT analysieren">✦</button>
        <button id="globalAdd" class="fab-mini" aria-label="Neuer Eintrag">＋</button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modalRoot"></div>
  </div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
